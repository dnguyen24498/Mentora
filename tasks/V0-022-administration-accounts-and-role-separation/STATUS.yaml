id: V0-022
title: "Administration accounts and role separation"
week: W8
status: DONE
depends_on: ["V0-021"]
started_at: "2026-10-19"
completed_at: "2026-10-19"
commit: "f0ac590"
blockers:
  - "No accepted ADR for the identity mechanism (FND-002 is TODO). The role separation is authorization, which V0-021 already fixed, so nothing here depends on that ADR; the credential adapter stays a labelled development mock."
notes:
  - "Three roles, attributed and bounded: `institution_admin` is named from the canonical role list (docs/ARC_OVERVIEW.md §27); ROLE_SCOPES[institution_admin] = {account:read, account:write, content:read, class:read} — the directory plus the read-only oversight the permission model names ('view institution-wide usage'), and nothing that authors, teaches or attends. Platform admin / IT operator / course admin / teaching assistant / moderator / auditor stay explicitly unmodelled. `join` remains the student's participant capability alone."
  - "Administering and assigning are different capabilities: `account:write` creates an account, `enrollment:write` assigns one; neither implies the other. A teacher holds `account:read` but may list/read **students only** (GET /accounts?role= is required, and a non-students role is 403 SCOPE_REQUIRED without account:write). Supersedes V0-021's 'invite by email creates-or-links the account inside enrolment': **enrolment never creates an account**, so an unknown address is 404 ACCOUNT_REQUIRED and nothing is written — an implicit signup behind an address is the outcome the separation exists to remove. The admin could not hold enrollment:write anyway, so a capability-gated create-or-link inside enrolment was dead by design."
  - "A disable is a revocation: PATCH status=DISABLED revokes the account's live sessions in the same call (DEC-RUNTIME-007) and reports sessions_revoked; a live token then reports SESSION_REVOKED (revocation is checked before account state) and a fresh sign-in ACCOUNT_DISABLED. A role change is the deliberate opposite — a live session's stored scopes are intersected with the issuing role, so a change can only ever remove a capability; a promotion takes effect at the next sign-in."
  - "An identity a class used is deactivated, not deleted: DELETE /accounts/{id} is refused (409 CONFLICT, ACCOUNT_IN_USE) while any roster in the tenant references the account, and the remedy is PATCH status=DISABLED. The roster check is composed in app/api/accounts_router.py (ClassroomService.enrolled_anywhere), so the identity domain never reads the classroom table. An unknown id is checked first, so it is 404, not 409."
  - "The first administrator is a one-shot, development-gated bootstrap: POST /auth/bootstrap-admin (unauthenticated by necessity, gated on Settings.dev_tenant_header) creates the institution's first institution_admin, refuses 409 TENANT_ALREADY_PROVISIONED once one exists, and is 404 BOOTSTRAP_DISABLED on a deployment that switches the shortcut off. MANAGED_ROLES = {teacher, student} excluding institution_admin means an administrator cannot create or promote a peer (409 ROLE_NOT_MANAGEABLE). With institutional federation the identity provider owns that account; nothing here is presented as the decided provisioning mechanism."
  - "Create is create-or-link and retry-safe (DEC-RUNTIME-003): same address + same role ⇒ created:false and development_credential:null (a retry can never re-mint a secret); same address + a different role ⇒ 409 EMAIL_ROLE_CONFLICT; an unknown role string ⇒ 400 INVALID_REQUEST — a caller-actionable refusal kept apart from a policy conflict."
  - "The tenant is a session claim, never a request field, on every new verb: an account of another institution is refused, and a token for tenant A cannot read or touch tenant B. Telemetry carries a subject_digest, never the address."
  - "Verification: backend 560 passed (tests/identity/, tests/test_accounts_api.py, tests/test_class_start.py, tests/test_identity_api.py); frontend 217 passed with `npx tsc --noEmit` clean; the whole flow exercised end-to-end in a real browser at 390px and 320px — bootstrap a fresh institution's first administrator, sign in, create a student in Admin → Accounts, see the one-time code once — with no horizontal overflow on /login, /admin/accounts, /admin/overview, /admin/classes and /."
  - "What is deliberately not claimed: the credential adapter stays local-credentials@1.0.0 (kind=DEVELOPMENT_MOCK); the bootstrap is a development seam; no federated provisioning, group/cohort sync, SSO/SAML, password policy, multi-role accounts, guardians or bulk import; no change to the Classroom Actor, the snapshot shape, the join credential's claims or the pinned-publication rule (DEC-CONTENT-005)."
