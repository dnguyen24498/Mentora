id: V0-019
title: "Slide rendering: source-layout default with platform fallbacks (plus themed re-layout)"
week: W4
status: DONE
depends_on: ["V0-005", "V0-006", "V0-018"]
started_at: "2026-10-17"
completed_at: "2026-10-17"
commit: "02ca28f"
blockers:
  - "FND-002 is still TODO, so DEC-TECH-005 (native PowerPoint rendering deployment/licensing) remains OPEN. This task adds a platform-themed renderer behind the DocumentRenderer interface; it does not accept a renderer technology and never claims a native/compatible render."
revisions:
  - "v1 (7b5e8a0): themed mode re-authored the content by classifying each slide into an archetype and re-flowing the IR. On a real art-directed deck this collided and was unreadable. Superseded by v2."
  - "v2 (d969f88): themed mode kept the author's layout and re-styled it in the platform theme (renderer mentora-themed-svg@2.0.0). This removed the collisions v1 introduced but inherited the source deck's own. Superseded by v3."
  - "v3 (ae68632): themed mode re-laid the content out as one readable column in the platform theme (flow.py + textmetrics.py + a px mentora_theme.py + a standalone ThemedSvgRenderer); renderer identity mentora-themed-svg@3.0.0, theme mentora-default v3.0.0. Superseded by v4."
  - "v4 (f528425): v3's single column destroyed the author's grouping (an icon row and its label row were emitted as two separate rows). v4 recovers the source geometry's rows and columns (flow.structure, a binary widest-gap XY-cut) and re-authors only the look inside each cell, with flat card surfaces for multi-object cells; renderer identity mentora-themed-svg@4.0.0, theme mentora-default v4.0.0."
  - "v5: the product owner rejected the re-layout as unlike their deck and asked for the source layout with the platform's look used only where a component cannot be reproduced. The default mode is now faithful (StructuralSvgRenderer, local-structural-svg@3.0.0): it reproduces the source slide's own layout and styling, and draws an unavailable source font (substituted with the platform type stack, FONT_SUBSTITUTED:<family>, and shrunk to stay inside the author's frame), a chart/SmartArt/graphic frame (UNSUPPORTED_OBJECT:<kind>) and an un-inlinable picture in flat platform panels, in place. These are warnings on a STRUCTURAL_RENDERED scene, not degradations: the real deck went from 28 × DEGRADED_RENDERED/requires_review to 28 × STRUCTURAL_RENDERED, publishable, no review. themed@4.0.0 is retained as the opt-in mode."
notes:
  - "Product decision (v5): same layout as the author's deck; where a component cannot be reproduced, draw it in the platform's default look, in place. The author's geometry, backgrounds, fills, pictures, tables and text formatting are reproduced; only the components we cannot reproduce are drawn in the platform's look."
  - "A component drawn in the platform look is a warning, not a degradation: the content is complete and the layout is the author's, so meaning is not at risk. DEGRADED_RENDERED stays reserved for a scene that genuinely cannot be drawn, and it — not a substituted font — is what sets requires_review."
  - "Font substitution is deterministic: the source family is dropped from the SVG and the platform's type stack is used, so two clients cannot get different assets for one deck. The substitution is recorded as FONT_SUBSTITUTED:<family> and surfaced in the review's missing_fonts."
  - "A frame whose typeface had to be substituted is shrunk to stay inside the author's frame instead of spilling text over a neighbouring block: our metrics are not the author's. A frame the source font already fits is left at its authored size."
  - "Because the author's geometry is kept, the author's own frame overlaps are kept too — exactly what PowerPoint shows. On the real deck 4 of 28 slides contain such an overlap (a heading's second line in the overlap band of the body box, the big number beside its unit label); 0 slides lose content."
  - "Product decision (v4, opt-in mode): the grouping is the author's, the content is the author's, the look is the platform's. The author's rows and columns are recovered from the source boxes and kept; type, size, colour, fill, spacing and exact geometry are re-authored. The flow measures and places in a single pass over a cursor, so two blocks cannot overlap by construction; across a row the cells take disjoint x-intervals; and the platform's page number sits in a strip the flow may not enter, so chrome cannot cover content either."
  - "The structure is recovered by a binary widest-gap XY-cut capped at MAX_STRUCTURE_DEPTH. A column split is only taken when both sides are at least theme.min_column_share of the region width, so a narrow icon column never splits from its label; a full-width object forbids a column cut through it. Same-key neighbours coalesce back into one run, and same-axis nesting flattens."
  - "In the opt-in mode a row cell that draws more than one block becomes a card: the content is inset by theme.card_pad_px and a flat theme.surface rounded panel is emitted before the content. Surfaces are backgrounds, not content, so they are excluded from the no-overlap geometry."
  - "Nothing is lost in either mode: no re-selection, re-ordering or clipping. Every paragraph, list level, table cell and picture is drawn. In the opt-in mode content that cannot fit even at the smallest readable scale is still drawn in full, flagged TEXT_OVERFLOW:<scene>, degraded for review, and the page number is omitted so nothing is covered; in the default mode a frame whose font was substituted is shrunk instead."
  - "Source hierarchy survives without copying the source's type scale in the opt-in mode: the slide's own sizes choose one of three theme rows (lead/body/caption, relative to the slide's most common size), and bold/italic runs are kept."
  - "Consecutive same-emphasis text boxes merge into one list in the opt-in mode: art-directed decks write each bullet in its own text box, and treating each box as a block would spend the page on gaps."
  - "In the opt-in mode the theme owns its typefaces, so a missing font cannot degrade it; its gate's meaning is content completeness, not visual fidelity to the source. Charts/SmartArt there cannot be redrawn and degrade with UNSUPPORTED_OBJECT:<kind>, requiring review."
  - "Text metrics are estimated from a font-free advance table (textmetrics.py) in both modes, so a line may break a word early; a substituted typeface can therefore wrap earlier than PowerPoint would."
  - "The theme is folded into the renderer config hash and the package cache key binds the renderer identity (name@version: local-structural-svg@3.0.0, mentora-themed-svg@4.0.0), so neither mode can be served for the other."
  - "No CI/lint config (FND-001 is still TODO), so tests and tsc are run manually."
