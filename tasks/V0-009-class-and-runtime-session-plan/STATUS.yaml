notes:
  - "Module home is backend/app/classroom/ (service.py, repository.py, models.py, catalog.py, snapshot.py, telemetry.py, router.py, errors.py). The task family's own allowlists put V0-010 -> classroom/, V0-013 -> classroom/timeline/, V1-004 -> classroom/turn/, so the empty reserved placeholders class_management/, session/, student/ are superseded and not used."
  - "State machine: SCHEDULED -> PREPARING -> ACTIVE, with PREPARING in-process only and never persisted (the same reasoning as V0-008's SEALING/INDEXING/COMMITTING). The plan, the session, the initial snapshot and the class's SCHEDULED->ACTIVE change commit in one transaction via one guarded UPDATE, so a crash mid-start leaves the class SCHEDULED and retryable: a partial start is invisible by construction (DEC-RELIABILITY-002)."
  - "No runtime 'latest' lookup: the tuple is resolved exactly once at start and written into an immutable RuntimeSessionPlan (UNIQUE (class_id), no update path). A class with no version named takes the course's current PUBLISHED publication at start; a class with version_id takes that version's publication (superseded included, DEC-CONTENT-005). Publishing a correction afterwards leaves the running session's tuple and snapshot byte-identical; a later class pins the newer version. Tested end to end."
  - "Pinned tuple (RuntimeSessionPlan.versions): course_id, course_version, version_id, publication_id, package_id, content_package_version, content_digest, lesson_plan_version, knowledge_index_version, index_version_id, index_source_digest, teaching_graph_version (nullable), assessment_version/model_routing_version (explicit nulls - the canonical tuple names them and V0 has neither subsystem, so an immutable tuple never gains a field later), policy_version, capability_version, region."
  - "Replaceable infrastructure: RuntimeCatalog ABC + BaselineRuntimeCatalog supplies policy_version ('runtime-policy@1', the name of the applied LOCKED default policy set), the supported CTF envelope versions ('1.0.0') and the home region from the new Settings.home_region (env MENTORA_HOME_REGION, default 'local-1'). DEC-TECH-009 (cloud/provider/regions) stays OPEN, so the region is configuration, never a decided geography. capability_version is derived from the *observed* default renderer identity (name@version) and the full identity is recorded in the plan's capabilities."
  - "Idempotency first: a repeat or a concurrent start returns the first session with created=false (DEC-RUNTIME-003); the loser either re-reads the winner or is classified COMMIT_CONFLICT. Enrollment is idempotent per (institution, class, student)."
  - "Refusals are classified with two new stable ErrorCodes: 409 CLASS_NOT_READY with issue_code VERSION_NOT_PUBLISHED / INCOMPATIBLE_INDEX / INCOMPATIBLE_CONTENT / CONTENT_DIGEST_MISMATCH / WRONG_STATE / COMMIT_CONFLICT / NOT_STARTED, and 403 NOT_ENROLLED. Start re-verifies the pinned package against its seal (verify_package) and never parses the source document (DEC-CONTENT-001). A damaged snapshot is 502 STORAGE_FAILURE + SNAPSHOT_INVALID. Every refusal is raised before the commit point, so nothing is written and the class stays SCHEDULED."
  - "Snapshot: durable session_snapshots row with snapshot_schema_version 'runtime-snapshot@1', regions state ACTIVE, actor_epoch 1, state_version/event_sequence 1, the pinned versions, lesson {lesson_plan_version, lesson_id, section_index 0, section_id, scene_id, scene_step_id} read from the pinned package's lesson-plan.json, empty turn.queue / null floor, timeline.checkpoint null, pending_effects []. checksum = sha256 over canonical JSON, stored as a column (not inside the document) and re-validated with the schema version on every read (DEC-DATA-004)."
  - "Join: POST /classes/{classId}/bootstrap-token issues a short-lived bound credential only to an enrolled student of an ACTIVE session, and stores only token_sha256. It binds class/student/session/actor_epoch/nonce/expiry and carries subscribe scope only (DEC-TURN-001). verify_bootstrap_token lives at service level (no client route yet; the media gateway uses it in V1) and refuses unknown/expired/revoked/stale-epoch tokens with distinct issue codes (DEC-RUNTIME-007); a stale-epoch token is proven refused by a test."
  - "Deliberate boundaries: no scheduler (scheduled_for is recorded, never enforced - DEC-TECH-003 OPEN); no outbox/event for class start (the ordered per-class log + outbox is DEC-DATA-003 and V1-002, so a start records state, snapshot and telemetry, which is CLASS_START.md's 'every terminal path emits metrics and user-visible state'); no room/SFU work (out of scope); enrollment is the class-scoped authorization that stands in for institutional federation, which does not exist in V0."
  - "Tests: backend/tests/test_class_start.py, 22 tests, covering all four required cases (draft version rejected, incompatible index, duplicate start, cross-tenant join) plus no-latest-lookup, pinned-tuple-survives-restart, nothing-written-then-retry, concurrent starts, a named older version, snapshot regions, tampered snapshot, damaged package, catalog injection, token digest/expiry/revocation/epoch, telemetry. Backend suite 405 passed (was 383)."
