blockers: []
notes:
  - "Reported symptom: GET /courses returned 500 on the running dev server. Root cause: create_app opened one sqlite3.Connection for the whole app while FastAPI serves sync endpoints from a worker threadpool, so transactions and cursors interleaved. Reproduced under load: 130/240 concurrent requests failed (including FOREIGN KEY constraint failures, i.e. transaction interleaving rather than only noise)."
  - "Fix: thread-scoped connections (Database) + PRAGMA busy_timeout so concurrent writers queue instead of failing. No new dependency, no store change; PostgreSQL stays the production target (DEC-DATA-001)."
