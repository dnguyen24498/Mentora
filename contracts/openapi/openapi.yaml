openapi: 3.1.0
info: {title: Mentora API, version: 1.0.0}
paths:
  /courses/{courseId}/materials:
    get:
      operationId: listMaterials
      parameters: [{in: path, name: courseId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Tenant-scoped materials of a course, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Material'}}
    post:
      operationId: uploadMaterial
      parameters: [{in: path, name: courseId, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
      responses: {'202': {description: Accepted}}
  /artifacts/{artifactId}:
    get:
      operationId: getArtifact
      description: >-
        Stored metadata for one uploaded artifact, tenant-scoped. The Teacher
        Studio reads it for the file name it shows as its page title.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        '404':
          description: 'Unknown artifact for this tenant (stable code NOT_FOUND)'
  /artifacts/{artifactId}/compile:
    post:
      operationId: compileArtifact
      description: >-
        Deterministic compile stage (V0-005): structural extraction, a fallback
        render for every slide with explicit fidelity, and the fidelity
        publication gate. Idempotent and re-runnable; renders are
        content-addressed. V0-019 v5: `mode=faithful` (default) reproduces the
        source slide's own layout and styling, drawing any component it cannot
        reproduce (an unavailable source font, a chart/SmartArt, an un-inlinable
        picture) in the platform look in place and recording a warning;
        `mode=themed` keeps the slide's grouping and re-lays its content out in the
        platform theme. Neither claims a native PowerPoint render.
      parameters:
        - {in: path, name: artifactId, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/RenderMode'
      responses:
        '200':
          description: Rendered Content IR plus render and validation reports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompileResult'}
        '400':
          description: 'Unknown render mode (stable code INVALID_REQUEST, issue_code UNKNOWN_RENDER_MODE)'
        '503':
          description: 'Renderer capability unavailable (stable code RENDERER_UNAVAILABLE)'
  /artifacts/{artifactId}/renders/{order}:
    get:
      operationId: getSceneRender
      description: >-
        Deterministic fallback visual for one slide (SVG), re-derived from the
        stored artifact. Tenant-scoped; never serves another tenant's render.
        `mode` selects the render mode (V0-019 v5, default `faithful`).
      parameters:
        - {in: path, name: artifactId, required: true, schema: {type: string}}
        - {in: path, name: order, required: true, schema: {type: integer, minimum: 0}}
        - $ref: '#/components/parameters/RenderMode'
      responses:
        '200':
          description: Rendered slide
          content:
            image/svg+xml:
              schema: {type: string}
        '400':
          description: 'Unknown render mode (stable code INVALID_REQUEST, issue_code UNKNOWN_RENDER_MODE)'
        '503':
          description: 'Scene has no render (stable code RENDERER_UNAVAILABLE)'
  /artifacts/{artifactId}/review-package:
    post:
      operationId: buildReviewPackage
      description: >-
        Teacher review preview (V0-007). Builds the Baseline Content Package for
        the artifact (V0-006, idempotent: source checksum + compiler version +
        renderer identity + renderer config hash determine the package identity)
        and returns the
        read-only review view of it: per-slide render reference, extracted text,
        speaker notes, warnings/fidelity, and the fallback lesson order with its
        safe markers. A package is only built when the V0-005 fidelity gate
        passed, so a document with a FAILED/CANCELLED/missing render answers 409
        and is never offered for review. Nothing here mutates the package.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The review view of the built package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPackage'}
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '409':
          description: 'Fidelity gate failed, so no package was built (stable code PUBLICATION_BLOCKED)'
    get:
      operationId: getReviewPackage
      description: >-
        The review view of the package already stored for this artifact. Cheap:
        it reads the package and never re-renders. 404 when the package has not
        been built yet.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The review view of the stored package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPackage'}
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
  /artifacts/{artifactId}/review-package/renders/{order}:
    get:
      operationId: getReviewRender
      description: >-
        One slide's packaged fallback render (SVG), served from the package
        itself so no re-rendering happens and no unauthenticated asset URL is
        needed. The artifact is only served after the package manifest confirms
        it lists the scene's fallback asset.
      parameters:
        - {in: path, name: artifactId, required: true, schema: {type: string}}
        - {in: path, name: order, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: The packaged slide render
          content:
            image/svg+xml:
              schema: {type: string}
        '404':
          description: 'No built package, or no such scene (stable code NOT_FOUND)'
  /artifacts/{artifactId}/review-package/decision:
    post:
      operationId: recordReviewDecision
      description: >-
        Teacher review action (V0-007): approve or reject the built package.
        Approving a document that is not publishable answers 409
        PUBLICATION_BLOCKED, so a blocking fidelity failure can never be
        approved. A rejection must record a reason. Approving moves the course
        version to APPROVED; the publication transition (APPROVED -> SEALING ->
        INDEXING -> COMMITTING -> PUBLISHED) is V0-008. The decision binds to the
        content version it reviewed (see ReviewState.stale) and is idempotent for
        a repeated identical action. Nothing here mutates the package.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '200':
          description: The review state after the action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewState'}
        '400':
          description: 'A rejection without a reason (stable code INVALID_REQUEST)'
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
        '409':
          description: 'Not publishable; approve refused (stable code PUBLICATION_BLOCKED)'
  /artifacts/{artifactId}/review-package/review-state:
    get:
      operationId: getReviewState
      description: >-
        The review *state* of the artifact's built package: the current decision
        (or null), the newest draft revision, how many revisions exist, the
        course-version status, and whether the decision still covers the current
        content version. Distinct from the ReviewPackage projection, which
        describes the package itself. 404 when no package has been built.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The review state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewState'}
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
  /artifacts/{artifactId}/review-package/drafts:
    post:
      operationId: saveReviewDraft
      description: >-
        Append a draft revision of the lesson order (V0-007). The body's array
        order *is* the proposed order; each entry names a section that must
        already exist in the package's lesson order, so a draft can only reorder
        and re-script. Every structural field (scene_id, scene_step_id,
        safe_markers, type) is inherited from the package, and an omitted script
        keeps the package's script. Refused with 400 when the submitted sections
        are not a rearrangement (issue codes EMPTY_DRAFT, UNKNOWN_SECTION,
        DUPLICATE_SECTION, MISSING_SECTION, INVALID_SCRIPT) and with 409
        REVISION_CONFLICT when a concurrent save won the revision. The immutable
        package is never written: corrections create new versions
        (DEC-CONTENT-005), and the draft is consumed by a later publication step.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDraftRequest'}
      responses:
        '200':
          description: The appended draft revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDraft'}
        '400':
          description: 'The sections are not a rearrangement of the lesson order (stable code INVALID_REQUEST)'
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
        '409':
          description: 'A concurrent save took the revision (issue code REVISION_CONFLICT)'
    get:
      operationId: listReviewDrafts
      description: >-
        Draft revision history for the artifact, newest first. Empty when the
        lesson order was never edited.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The draft revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDraftList'}
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
  /course-versions/{versionId}/publish:
    post:
      operationId: publishVersion
      description: >-
        Atomic publication (V0-008). Seals the built package (verifies checksums
        and references, records the manifest and content digests), establishes
        the compatible knowledge-index version, and commits the publication
        metadata, the index-version record and the outbox event in one
        transaction — only after which the version is visible as PUBLISHED.
        Preconditions: the version is APPROVED and its newest review decision is
        an APPROVE covering the package's current content_package_version.
        Idempotent (DEC-RUNTIME-003): the identity is (versionId,
        content_package_version), so a repeat returns the same publication with
        `created: false` instead of a second one. Validation failures are
        refused before anything is written: `issue_code` is NOT_APPROVED,
        STALE_APPROVAL, WRONG_STATE, the validator's code (e.g.
        CHECKSUM_MISMATCH), or INDEX_FAILED.
      parameters: [{in: path, name: versionId, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '200':
          description: The publication (created, or replayed when already published)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedVersion'}
        '403':
          description: 'Version belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for the version''s artifact (stable code NOT_FOUND)'
        '409':
          description: 'Publication refused (stable code PUBLICATION_BLOCKED, precise issue_code)'
  /course-versions/{versionId}/publication:
    get:
      operationId: getVersionPublication
      description: >-
        The newest publication of a course version, or 404 when it has not been
        published. `verify=true` re-reads the pinned package and re-checks it
        against the digest recorded at seal time, adding an `integrity` block
        (VERIFIED / MISMATCH / MISSING).
      parameters:
        - {in: path, name: versionId, required: true, schema: {type: string}}
        - {in: query, name: verify, required: false, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: The publication, optionally with its integrity report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        '403':
          description: 'Version belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'The version has not been published (stable code NOT_FOUND)'
  /publications/{publicationId}:
    get:
      operationId: getPublication
      description: >-
        One publication by identity, including a superseded one: DEC-CONTENT-005
        pins all compatible versions, so a session that started on an older
        publication keeps reading it. A publication of another institution is
        NOT_FOUND rather than forbidden (the lookup is tenant-scoped, so it does
        not leak existence). `verify=true` adds the integrity report.
      parameters:
        - {in: path, name: publicationId, required: true, schema: {type: string}}
        - {in: query, name: verify, required: false, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: The publication, optionally with its integrity report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        '404':
          description: 'Unknown publication or another institution''s (stable code NOT_FOUND)'
  /courses/{courseId}/publications:
    get:
      operationId: listCoursePublications
      description: >-
        A course's publication history, newest first. Superseded publications are
        included: they are history, not deletions.
      parameters:
        - {in: path, name: courseId, required: true, schema: {type: string}}
        - {in: query, name: limit, required: false, schema: {type: integer, default: 50, maximum: 500}}
      responses:
        '200':
          description: The course's publications, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationPage'}
        '403':
          description: 'Course belongs to another institution (stable code TENANT_ACCESS_DENIED)'
  /classes:
    post:
      operationId: scheduleClass
      description: >-
        Schedule a class against a course (V0-009). Scheduling records intent
        only: nothing is pinned until `start`, which resolves the exact runtime
        version tuple once. `version_id` pins a version explicitly (it must belong
        to the course); omitted, `start` resolves the course's current published
        version. `scheduled_for` is recorded, never enforced — there is no
        scheduler or durable workflow (DEC-TECH-003 is OPEN), so `start` is the
        explicit transition.
      parameters:
        - {in: query, name: course_id, required: true, schema: {type: string}}
        - {in: query, name: title, required: false, schema: {type: string, maxLength: 512}}
        - {in: query, name: version_id, required: false, schema: {type: string}}
        - {in: query, name: scheduled_for, required: false, schema: {type: string, format: date-time}}
      responses:
        '201':
          description: The scheduled class
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Class'}
        '400':
          description: 'Malformed request (stable code INVALID_REQUEST): a version that is not this course''s, or a non-ISO scheduled_for'
        '403':
          description: 'Course belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'Unknown course for this tenant (stable code NOT_FOUND)'
    get:
      operationId: listClasses
      description: The tenant's classes, newest first.
      parameters:
        - {in: query, name: limit, required: false, schema: {type: integer, default: 100, maximum: 500}}
      responses:
        '200':
          description: Classes of the tenant
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Class'}}
  /classes/{classId}:
    get:
      operationId: getClass
      description: >-
        The class with its session and pinned runtime tuple. `session` and
        `session_plan` are null before a successful start.
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: Class, session and pinned runtime tuple
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassView'}
        '403':
          description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'Unknown class (stable code NOT_FOUND)'
  /classes/{classId}/start:
    post:
      operationId: startClass
      description: >-
        `SCHEDULED -> PREPARING -> ACTIVE` (V0-009). The session resolves the exact
        runtime tuple **once** — course/version/publication/package/content,
        lesson plan, knowledge-index pin, policy, capability and home region — and
        commits it together with the initial durable snapshot in one transaction,
        so a partial start is invisible and a refused start writes nothing. No
        runtime `latest` lookup exists: after this call a session reads its own
        pinned plan, and a later publication cannot move it (DEC-CONTENT-005).
        Idempotent: a replay returns the same session with `created: false`
        (DEC-RUNTIME-003).
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: >-
            The session, its pinned tuple and its initial snapshot. `created` is
            false when this call replayed an existing session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassStartResult'}
        '403':
          description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'Unknown class (stable code NOT_FOUND)'
        '409':
          description: >-
            The class cannot start (stable code CLASS_NOT_READY). `issue_code` is
            VERSION_NOT_PUBLISHED (draft or never published), INCOMPATIBLE_INDEX
            (the index pin is not about this content), INCOMPATIBLE_CONTENT (the
            package envelope or lesson plan is not one this runtime supports),
            CONTENT_DIGEST_MISMATCH (the pinned bytes no longer match the seal),
            WRONG_STATE, or COMMIT_CONFLICT. The class stays SCHEDULED and nothing
            is written.
  /classes/{classId}/snapshot:
    get:
      operationId: getSnapshot
      description: >-
        The authoritative session snapshot (DEC-DATA-004). Its schema version and
        checksum are validated before it is returned, so a damaged snapshot is
        refused (502 STORAGE_FAILURE, issue_code SNAPSHOT_INVALID) rather than
        replayed.
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: The validated snapshot document and its checksum
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionSnapshot'}
        '403':
          description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'Unknown class, or the class has not started (stable code NOT_FOUND)'
        '502':
          description: 'Stored snapshot fails validation (stable code STORAGE_FAILURE, issue_code SNAPSHOT_INVALID)'
  /classes/{classId}/enrollments:
    post:
      operationId: enrollStudent
      description: >-
        Enroll a student in a class. Idempotent per (class, student): enrolling
        twice is one enrollment, so a retried command is not an error.
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
        - {in: query, name: student_id, required: true, schema: {type: string, maxLength: 256}}
      responses:
        '200':
          description: The enrollment (`created` is false on a replay)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        '400': {description: 'Missing student_id (stable code INVALID_REQUEST)'}
        '403': {description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED)'}
        '404': {description: 'Unknown class (stable code NOT_FOUND)'}
    get:
      operationId: listEnrollments
      description: The class roster the join check is made against.
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: The class's enrollments
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentList'}
        '403': {description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED)'}
        '404': {description: 'Unknown class (stable code NOT_FOUND)'}
  /classes/{classId}/bootstrap-token:
    post:
      operationId: issueBootstrapToken
      description: >-
        Issue a short-lived join credential — only to a student enrolled in a
        running class. This is where "only authorized enrollment can join" is
        enforced: the class must be ACTIVE and the principal must be enrolled in
        this class in this tenant. The raw token is returned once and only its
        digest is stored; it binds class, student, session and actor epoch
        (DEC-RUNTIME-007) and carries `subscribe` scope only — group student
        microphones are unpublished by default (DEC-TURN-001). The media gateway
        validates it in V1; this endpoint creates no room/SFU (out of scope).
      parameters: [$ref: '#/components/parameters/ClassId']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BootstrapTokenRequest'}
      responses:
        '200':
          description: The issued credential (the only view of the raw token)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BootstrapToken'}
        '403':
          description: 'Not enrolled in this class (stable code NOT_ENROLLED), or the class is another institution''s (stable code TENANT_ACCESS_DENIED)'
        '404': {description: 'Unknown class (stable code NOT_FOUND)'}
        '409':
          description: 'The class has not started (stable code CLASS_NOT_READY, issue_code NOT_STARTED)'
  /renderer:
    get:
      operationId: getRendererStatus
      description: >-
        Renderer capability, identity, health, and the active theme (V0-005,
        V0-019). Reports the default render mode and every available mode; the
        `mode` query parameter inspects a specific one.
      parameters: [$ref: '#/components/parameters/RenderMode']
      responses:
        '200':
          description: Capability report, circuit-breaker state, and mode list
        '400':
          description: 'Unknown render mode (stable code INVALID_REQUEST, issue_code UNKNOWN_RENDER_MODE)'
components:
  parameters:
    RenderMode:
      in: query
      name: mode
      required: false
      description: >-
        Render mode (V0-019 v5). `faithful` (default) reproduces the source
        slide's own layout and styling, drawing what it cannot reproduce in the
        platform look in place; `themed` keeps the slide's grouping and re-lays its
        content out in the platform theme. An unknown value is rejected with
        INVALID_REQUEST (issue_code UNKNOWN_RENDER_MODE).
      schema: {type: string, enum: [themed, faithful]}
    ClassId:
      in: path
      name: classId
      required: true
      description: The class (a scheduled teaching occurrence), tenant-scoped.
      schema: {type: string}
  schemas:
    Artifact:
      description: Stored source presentation metadata (one immutable upload).
      type: object
      required: [artifact_id, course_id, version_id, filename, media_type, sha256, byte_size, object_key, created_at]
      properties:
        artifact_id: {type: string}
        course_id: {type: string}
        version_id: {type: string}
        filename: {type: string}
        media_type: {type: string}
        sha256: {type: string}
        byte_size: {type: integer}
        object_key: {type: string}
        created_at: {type: string}
    Material:
      description: An uploaded source presentation with its version and compiler-job status.
      type: object
      required: [artifact_id, version_id, version, filename, media_type, sha256, byte_size, created_at, job_id, job_status]
      properties:
        artifact_id: {type: string}
        version_id: {type: string}
        version: {type: integer, description: Course version number the artifact belongs to}
        filename: {type: string}
        media_type: {type: string}
        sha256: {type: string}
        byte_size: {type: integer}
        created_at: {type: string}
        job_id: {type: string}
        job_status: {type: string, enum: [PENDING, EXTRACTED, FAILED]}
    RendererIdentity:
      description: Who rendered what, with which config (DEC-CONTENT-006 provenance).
      type: object
      required: [name, version, engine, config_hash, data_region]
      properties:
        name: {type: string}
        version: {type: string}
        engine: {type: string, description: 'Local/dev engine until DEC-TECH-005 is accepted'}
        config_hash: {type: string}
        data_region: {type: string}
    SceneRender:
      description: Render outcome for one slide. Every slide has a render or an explicit FAILED.
      type: object
      required: [order, scene_id, status]
      properties:
        order: {type: integer, minimum: 0}
        scene_id: {type: string}
        status: {type: string, enum: [RENDERED, FAILED, CANCELLED]}
        fidelity:
          type: [string, 'null']
          enum: [NATIVE_RENDERED, COMPATIBLE_RENDERED, STRUCTURAL_RENDERED, THEMED_RENDERED, DEGRADED_RENDERED, null]
        asset_ref: {type: [string, 'null'], description: Content-addressed fallback asset key}
        asset_bytes: {type: integer}
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        fonts_used: {type: array, items: {type: string}}
        missing_fonts: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        error:
          type: [object, 'null']
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
        attempts: {type: integer, minimum: 1}
        duration_ms: {type: integer, minimum: 0}
    RenderUsage:
      type: object
      required: [slides_rendered, slides_failed, slides_cancelled, asset_bytes, duration_ms, cost_units, data_region]
      properties:
        slides_rendered: {type: integer}
        slides_failed: {type: integer}
        slides_cancelled: {type: integer}
        asset_bytes: {type: integer}
        duration_ms: {type: integer}
        cost_units: {type: number}
        data_region: {type: string}
    RenderReport:
      type: object
      required: [cancelled, warnings, usage, scenes]
      properties:
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        cancelled: {type: boolean}
        warnings: {type: array, items: {type: string}}
        usage: {$ref: '#/components/schemas/RenderUsage'}
        scenes: {type: array, items: {$ref: '#/components/schemas/SceneRender'}}
    ValidationIssue:
      type: object
      required: [code, message, severity]
      properties:
        code: {type: string}
        message: {type: string}
        severity: {type: string, enum: [error, review, warning]}
        scene_order: {type: [integer, 'null']}
    ValidationReport:
      description: Fidelity gate. A failed render blocks publication (V0-005 acceptance).
      type: object
      required: [ok, publishable, requires_review, scene_count, issues]
      properties:
        ok: {type: boolean}
        publishable: {type: boolean}
        requires_review: {type: boolean}
        scene_count: {type: integer}
        issues: {type: array, items: {$ref: '#/components/schemas/ValidationIssue'}}
    CompileResult:
      type: object
      required: [content_ir, render, validation, job_status]
      properties:
        content_ir: {type: object, description: 'Internal Content IR (never served to classroom clients)'}
        render: {$ref: '#/components/schemas/RenderReport'}
        validation: {$ref: '#/components/schemas/ValidationReport'}
        job_status: {type: string, enum: [PENDING, EXTRACTED, FAILED]}
    ReviewScene:
      description: >-
        One slide exactly as it appears in the package under review
        (DEC-CONTENT-006: explicit fidelity, renderer identity, warnings).
      type: object
      required: [order, scene_id, fidelity, render_status, render_url, requires_review, missing_fonts, warnings, text, object_count, step_count]
      properties:
        order: {type: integer, minimum: 0}
        scene_id: {type: string}
        fidelity:
          type: [string, 'null']
          enum: [NATIVE_RENDERED, COMPATIBLE_RENDERED, STRUCTURAL_RENDERED, THEMED_RENDERED, DEGRADED_RENDERED, null]
        render_status: {type: string, enum: [RENDERED, FAILED]}
        fallback_asset: {type: [string, 'null'], description: 'Path of the render inside the package'}
        render_url: {type: string, description: 'Endpoint serving this slide, tenant-scoped; versioned with the packaged asset digest (?v=<sha256>) so a recompile cannot be served from cache'}
        requires_review: {type: boolean, description: 'Degraded fidelity (V0-019 v5: a substituted source font or a platform-look fallback component is a warning, not a review)'}
        missing_fonts: {type: array, items: {type: string}, description: 'Source fonts not available to the renderer; each was substituted with the platform stack, in the run''s original frame (V0-019 v5)'}
        warnings: {type: array, items: {type: string}}
        notes: {type: [string, 'null'], description: 'Speaker notes, verbatim (DEC-CONTENT-008)'}
        text: {type: array, items: {type: string}}
        object_count: {type: integer, minimum: 0}
        step_count: {type: integer, minimum: 0}
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        source_ref: {type: object}
    ReviewSection:
      description: One entry of the fallback lesson order (DEC-CONTENT-007).
      type: object
      required: [order, section_id, type, safe_markers]
      properties:
        order: {type: integer, minimum: 0}
        section_id: {type: string}
        type: {type: string, enum: [EXPLANATION, EXAMPLE, MEDIA, QUIZ, DISCUSSION]}
        scene_id: {type: [string, 'null']}
        scene_step_id: {type: [string, 'null']}
        safe_markers: {type: array, items: {type: string}}
        script: {type: [string, 'null']}
        scene_fidelity: {type: [string, 'null']}
        requires_review: {type: boolean}
    ReviewPackage:
      description: >-
        Read-only review projection of a built Baseline Content Package: it
        describes the content itself (render, text, notes, fidelity, lesson
        order) and is a pure function of the stored bytes. The mutable review
        overlay — the decision and the draft revisions — is ReviewState.
        Nothing here is writable, and the publication transition is V0-008.
      type: object
      required: [artifact_id, package_id, prefix, course_id, course_version, content_package_version, knowledge_index_version, created_at, state, publishable, requires_review, scene_count, file_count, placeholder_notice, lesson_order, scenes]
      properties:
        artifact_id: {type: string}
        package_id: {type: string, description: 'Deterministic: identical content resolves to the same package'}
        prefix: {type: string}
        course_id: {type: string}
        course_version: {type: string}
        content_package_version: {type: string}
        lesson_plan_version: {type: [string, 'null']}
        knowledge_index_version: {type: string, description: '"unindexed" until V0-014'}
        teaching_graph_version: {type: [string, 'null']}
        created_at: {type: string}
        state: {type: string, enum: [READY, REVIEW_REQUIRED, BLOCKED]}
        publishable: {type: boolean}
        requires_review: {type: boolean}
        scene_count: {type: integer, minimum: 0}
        file_count: {type: integer, minimum: 0}
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        placeholder_notice:
          type: string
          description: 'States that the render is a placeholder, not a native render (DEC-TECH-005 is OPEN)'
        lesson_order: {type: array, items: {$ref: '#/components/schemas/ReviewSection'}}
        scenes: {type: array, items: {$ref: '#/components/schemas/ReviewScene'}}
    ReviewDecisionRequest:
      description: An approve/reject action on the built package (V0-007).
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason:
          type: [string, 'null']
          maxLength: 4000
          description: 'Required for REJECT; the audit trail for why the content was refused'
        reviewer:
          type: [string, 'null']
          maxLength: 256
          description: >-
            Attribution only. Identity and roles are not implemented yet, so
            this is not an authorization control; it defaults to the tenant id.
    ReviewDecision:
      description: One recorded review outcome for one content version.
      type: object
      required: [decision_id, artifact_id, version_id, package_id, content_package_version, decision, reviewer, created_at]
      properties:
        decision_id: {type: string}
        artifact_id: {type: string}
        version_id: {type: string}
        package_id: {type: string}
        content_package_version:
          type: string
          description: 'The content the decision covers; a mismatch makes the decision stale'
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason: {type: [string, 'null']}
        reviewer: {type: string}
        created_at: {type: string}
    ReviewDraftSectionRequest:
      description: One entry of a proposed lesson order; array position is the order.
      type: object
      required: [section_id]
      additionalProperties: false
      properties:
        section_id:
          type: string
          minLength: 1
          description: 'Must already exist in the package lesson order'
        script:
          type: [string, 'null']
          maxLength: 20000
          description: 'Omitted/null keeps the package script; empty string means no script'
    ReviewDraftRequest:
      type: object
      required: [sections]
      additionalProperties: false
      properties:
        sections: {type: array, items: {$ref: '#/components/schemas/ReviewDraftSectionRequest'}}
        edited_by:
          type: [string, 'null']
          maxLength: 256
          description: 'Attribution only; defaults to the tenant id'
    ReviewDraftSection:
      description: >-
        One resolved entry of a draft revision. Every structural field is
        inherited from the package under review, so a draft cannot forge or drop
        a scene reference.
      type: object
      required: [order, section_id, type, safe_markers]
      properties:
        order: {type: integer, minimum: 0}
        section_id: {type: string}
        type: {type: string, enum: [EXPLANATION, EXAMPLE, MEDIA, QUIZ, DISCUSSION]}
        scene_id: {type: [string, 'null']}
        scene_step_id: {type: [string, 'null']}
        safe_markers: {type: array, items: {type: string}}
        script: {type: [string, 'null']}
    ReviewDraft:
      description: One immutable revision of a proposed lesson order (append-only).
      type: object
      required: [draft_id, artifact_id, version_id, package_id, content_package_version, revision, sections, edited_by, created_at]
      properties:
        draft_id: {type: string}
        artifact_id: {type: string}
        version_id: {type: string}
        package_id: {type: string}
        content_package_version: {type: string}
        lesson_plan_version: {type: [string, 'null'], description: 'The lesson plan version this draft revises'}
        revision: {type: integer, minimum: 1}
        sections: {type: array, items: {$ref: '#/components/schemas/ReviewDraftSection'}}
        edited_by: {type: string}
        created_at: {type: string}
    ReviewDraftList:
      type: object
      required: [artifact_id, revisions]
      properties:
        artifact_id: {type: string}
        revisions:
          type: array
          description: Newest revision first
          items: {$ref: '#/components/schemas/ReviewDraft'}
    ReviewState:
      description: >-
        The mutable review overlay of one built package: the current decision,
        the newest draft revision, and the blocking picture. `stale` is true when
        the decision covered a different content version than the one now stored,
        so a stale approval is never mistaken for a current one.
      type: object
      required: [artifact_id, version_id, version_status, package_id, content_package_version, state, publishable, requires_review, stale, blocking_scene_orders, draft_count]
      properties:
        artifact_id: {type: string}
        version_id: {type: string}
        version_status:
          type: string
          enum: [DRAFT, PROCESSING, REVIEW_REQUIRED, APPROVED, PUBLISHED, ARCHIVED]
        package_id: {type: string}
        content_package_version: {type: string}
        state: {type: string, enum: [READY, REVIEW_REQUIRED, BLOCKED]}
        publishable: {type: boolean, description: 'False means a blocking failure; approval is refused'}
        requires_review: {type: boolean}
        stale: {type: boolean, description: 'The decision no longer covers the stored content'}
        blocking_scene_orders:
          type: array
          items: {type: integer}
          description: 'Slide orders that failed to render and block approval'
        decision: {oneOf: [{$ref: '#/components/schemas/ReviewDecision'}, {type: 'null'}]}
        draft: {oneOf: [{$ref: '#/components/schemas/ReviewDraft'}, {type: 'null'}]}
        draft_count: {type: integer, minimum: 0}
    PublishRequest:
      description: Optional attribution for a publication (not an authorization control in V0).
      type: object
      additionalProperties: false
      properties:
        published_by: {type: string, maxLength: 256}
    Publication:
      description: >-
        One committed publication: an immutable package plus the compatible
        version tuple a runtime pins (DEC-CONTENT-005, DEC-DATA-005). Rows are
        immutable facts; a correction publishes a new course version and links the
        previous publication through `superseded_by` instead of deleting it.
        `content_digest` is the seal over the published content — re-check it with
        `?verify=true`, which adds `integrity`.
      type: object
      required: [publication_id, institution_id, course_id, version_id, course_version, artifact_id, package_id, content_package_version, lesson_plan_versions, knowledge_index_version, index_version_id, package_prefix, manifest_sha256, content_digest, file_count, total_bytes, state, published_by, created_at]
      properties:
        publication_id: {type: string}
        institution_id: {type: string}
        course_id: {type: string}
        version_id: {type: string}
        course_version: {type: integer, minimum: 1}
        artifact_id: {type: string}
        package_id: {type: string}
        content_package_version: {type: string}
        lesson_plan_versions: {type: array, items: {type: string}}
        knowledge_index_version:
          type: string
          description: 'The pinned index identity (DEC-DATA-005); "unindexed" until V0-014 builds index content'
        teaching_graph_version: {type: [string, 'null']}
        index_version_id: {type: string}
        package_prefix: {type: string, description: 'Object-store prefix the publication pins (packages/<package_id>)'}
        manifest_sha256: {type: string, description: 'Envelope digest as sealed (provenance)'}
        content_digest: {type: string, description: 'Digest over the sealed content; must never change'}
        file_count: {type: integer}
        total_bytes: {type: integer}
        state: {type: string, enum: [PUBLISHED, SUPERSEDED]}
        superseded_by: {type: [string, 'null']}
        published_by: {type: string}
        created_at: {type: string}
        created:
          type: boolean
          description: 'Present on the publish response: false when the request replayed an existing publication'
        integrity: {$ref: '#/components/schemas/PublicationIntegrity'}
    PublishedVersion:
      description: 'The publish response: the publication plus whether this call created it.'
      allOf:
        - {$ref: '#/components/schemas/Publication'}
        - type: object
          required: [created]
          properties:
            created: {type: boolean}
    PublicationPage:
      type: object
      required: [course_id, publications]
      properties:
        course_id: {type: string}
        publications:
          type: array
          description: Newest first; superseded publications included
          items: {$ref: '#/components/schemas/Publication'}
    PublicationIntegrity:
      description: >-
        Result of re-checking a published package against the digest recorded at
        seal time (opt-in with `?verify=true`). VERIFIED means the pinned content
        is exactly what was published; MISMATCH means something overwrote or
        dropped part of it, and `issues` names which validator codes fired —
        `PUBLICATION_BLOCKED` is not returned, because a caller asking for a
        verdict wants the verdict.
      type: object
      required: [state, package_id, expected_digest, observed_digest, file_count, issues]
      properties:
        state: {type: string, enum: [VERIFIED, MISMATCH, MISSING]}
        package_id: {type: string}
        expected_digest: {type: string}
        observed_digest: {type: string}
        file_count: {type: integer}
        issues: {type: array, items: {type: string}}
    Class:
      description: >-
        A scheduled teaching occurrence (V0-009). It pins nothing until it starts;
        `version_id` is the version the teacher named when scheduling, and null
        means the start resolves the course's current published version once.
      type: object
      required: [class_id, institution_id, course_id, title, state, created_at]
      properties:
        class_id: {type: string}
        institution_id: {type: string}
        course_id: {type: string}
        title: {type: string}
        version_id:
          type: [string, 'null']
          description: 'An explicit version pin, or null to resolve at start'
        scheduled_for:
          type: [string, 'null']
          description: 'Recorded intent only; there is no scheduler (DEC-TECH-003 is OPEN)'
        state:
          type: string
          enum: [SCHEDULED, ACTIVE, DEGRADED, RECOVERING, ENDING, COMPLETED, FAILED]
          description: >-
            SCHEDULED until a successful start; the transitions after ACTIVE
            belong to the Classroom Actor (V0-010). PREPARING is in-flight only and
            is never stored.
        created_at: {type: string}
        started_at: {type: [string, 'null']}
    ClassView:
      description: A class with its session and pinned runtime tuple (both null before a start).
      type: object
      required: [class, session, session_plan]
      properties:
        class: {$ref: '#/components/schemas/Class'}
        session: {oneOf: [{$ref: '#/components/schemas/ClassroomSession'}, {type: 'null'}]}
        session_plan: {oneOf: [{$ref: '#/components/schemas/RuntimeSessionPlan'}, {type: 'null'}]}
    RuntimeVersions:
      description: >-
        The pinned runtime tuple (docs/architecture/03_DOMAIN_OWNERSHIP_AND_VERSIONING.md):
        every member is a resolved value, never a lookup. `latest` is forbidden, so
        a later publication cannot move a running session. `assessment_version` and
        `model_routing_version` are explicit nulls because V0 has neither subsystem.
      type: object
      required: [course_id, course_version, version_id, publication_id, package_id, content_package_version, content_digest, lesson_plan_version, knowledge_index_version, index_version_id, index_source_digest, policy_version, capability_version, region]
      properties:
        course_id: {type: string}
        course_version: {type: integer, minimum: 1}
        version_id: {type: string}
        publication_id: {type: string}
        package_id: {type: string}
        content_package_version: {type: string}
        content_digest: {type: string, description: 'The seal digest of the pinned bytes'}
        lesson_plan_version: {type: string}
        knowledge_index_version: {type: string}
        index_version_id: {type: string}
        index_source_digest:
          type: string
          description: 'The content this index pin is compatible with (DEC-DATA-005)'
        teaching_graph_version: {type: [string, 'null']}
        assessment_version: {type: [string, 'null']}
        model_routing_version: {type: [string, 'null']}
        policy_version:
          type: string
          description: 'Names the LOCKED default policy set the session ran under'
        capability_version:
          type: string
          description: 'The warmed capability identity, name@version of the default renderer'
        region: {type: string, description: 'Home region (DEC-DEPLOY-002); configuration, not a decided geography'}
    RuntimeSessionPlan:
      description: >-
        The class-specific immutable tuple (terminology: RuntimeSessionPlan, owner
        Class Management), written once at start with no update path.
      type: object
      required: [session_plan_id, class_id, versions, capabilities, created_at]
      properties:
        session_plan_id: {type: string}
        class_id: {type: string}
        versions: {$ref: '#/components/schemas/RuntimeVersions'}
        capabilities:
          type: object
          description: 'Renderer identity and support the session admitted through'
          properties:
            identity: {type: object}
            support: {type: object}
        created_at: {type: string}
    ClassroomSession:
      description: The durable session created at start, with its initial authoritative state.
      type: object
      required: [session_id, class_id, course_id, session_plan_id, state, actor_epoch, state_version, event_sequence, created_at, started_at]
      properties:
        session_id: {type: string}
        class_id: {type: string}
        course_id: {type: string}
        session_plan_id: {type: string}
        state: {type: string, enum: [SCHEDULED, ACTIVE, DEGRADED, RECOVERING, ENDING, COMPLETED, FAILED]}
        actor_epoch:
          type: integer
          minimum: 1
          description: 'Initial epoch is 1; ownership transfer/fencing is V1-002 (DEC-RUNTIME-007)'
        state_version: {type: integer, minimum: 1}
        event_sequence: {type: integer, minimum: 0}
        snapshot_id: {type: [string, 'null']}
        created_at: {type: string}
        started_at: {type: string}
    SessionSnapshot:
      description: >-
        A durable, checksummed snapshot (DEC-DATA-004). Validated before use: an
        unsupported schema version, a missing region, or a checksum mismatch is
        refused rather than replayed. `document` carries versions, lesson/scene/step,
        turn (queue/floor), timeline checkpoint, pending effects, epoch/version/sequence.
      type: object
      required: [snapshot_id, class_id, session_id, schema_version, state, state_version, event_sequence, actor_epoch, checksum, created_at, document]
      properties:
        snapshot_id: {type: string}
        class_id: {type: string}
        session_id: {type: string}
        schema_version: {type: string, description: 'e.g. runtime-snapshot@1'}
        state: {type: string}
        state_version: {type: integer}
        event_sequence: {type: integer}
        actor_epoch: {type: integer}
        checksum: {type: string, description: 'sha256 over the canonical document'}
        created_at: {type: string}
        document: {type: object}
    ClassStartResult:
      description: 'The start response: the class, its session, the pinned tuple and the initial snapshot.'
      type: object
      required: [class, session, session_plan, snapshot, created]
      properties:
        class: {$ref: '#/components/schemas/Class'}
        session: {$ref: '#/components/schemas/ClassroomSession'}
        session_plan: {$ref: '#/components/schemas/RuntimeSessionPlan'}
        snapshot: {$ref: '#/components/schemas/SessionSnapshot'}
        created:
          type: boolean
          description: 'False when the request replayed an existing session (DEC-RUNTIME-003)'
    Enrollment:
      description: One student's authorization to join one class.
      type: object
      required: [enrollment_id, class_id, student_id, created_at]
      properties:
        enrollment_id: {type: string}
        class_id: {type: string}
        student_id: {type: string}
        created_at: {type: string}
        created:
          type: boolean
          description: 'Present on the enroll response: false when the enrollment already existed'
    EnrollmentList:
      type: object
      required: [class_id, enrollments]
      properties:
        class_id: {type: string}
        enrollments: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
    BootstrapTokenRequest:
      type: object
      required: [student_id]
      additionalProperties: false
      properties:
        student_id:
          type: string
          minLength: 1
          maxLength: 256
          description: 'Who is asking to join; enrollment is what authorizes it'
    BootstrapToken:
      description: >-
        A short-lived join credential. Returned once — only its sha256 digest is
        stored — bound to the class, student, session and actor epoch, with
        subscribe scope only.
      type: object
      required: [token, class_id, session_id, student_id, actor_epoch, nonce, scopes, issued_at, expires_at]
      properties:
        token: {type: string, description: 'The raw credential; the only time it is returned'}
        class_id: {type: string}
        session_id: {type: string}
        student_id: {type: string}
        actor_epoch: {type: integer, description: 'A token from a stale epoch cannot authorize'}
        nonce: {type: string}
        scopes: {type: array, items: {type: string, enum: [subscribe]}, description: 'Subscribe only: floor/publish_audio is the floor token (DEC-TURN-008)'}
        issued_at: {type: string}
        expires_at: {type: string, description: 'Bounded lifetime; the terminal path besides revocation'}

