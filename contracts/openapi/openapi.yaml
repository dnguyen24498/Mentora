openapi: 3.1.0
info:
  title: Mentora API
  version: 1.0.0
  description: >-
    Every request resolves a **principal**, and the tenant is derived from that
    principal — never from a request field — so an institution boundary cannot be
    widened by what a caller names (V0-021; `docs/security/IDENTITY_AUTHORIZATION_AND_TOKENS.md`).

    Two credentials are accepted, in this order:

    * `Authorization: Bearer <session token>` — a signed-in account. The tenant is
      the session's, and `X-Institution-Id` is **ignored** when a session is present.
    * `X-Institution-Id: <institution>` — the development tenant shortcut. It
      resolves a teacher principal with `authenticated: false` and **no account**. A
      teacher is not a participant, so it cannot request a class join (the `join`
      capability is the student's). It is **off by default** (V0-023): a deployment
      requires a real session unless it explicitly sets `MENTORA_DEV_TENANT_HEADER=1`.

    A request with neither is `401 UNAUTHENTICATED` (issue_code `SESSION_REQUIRED`).
    Authorization is expressed as **capabilities**, not role names: a verb requires a
    scope, and a principal that lacks it is refused with `403 INSUFFICIENT_SCOPE`
    (issue_code `SCOPE_REQUIRED`). Scopes are the session's, **intersected** with the
    account's role on every request, so narrowing a role takes effect on the next
    request rather than at session expiry and a role change can never grant a session
    a capability it was not issued with.

    Three roles are modelled, from the canonical list in `docs/ARC_OVERVIEW.md` §27:
    an **institution administrator** (`account:read`, `account:write`, and the
    read-only oversight scopes `content:read` and `class:read`) who owns the
    directory; a **teacher** who authors, publishes and runs classes; and a
    **student** who attends one. The other canonical roles are deliberately not
    modelled. Every account signs in and out through the same `/auth/*` surface, and
    signs in with a **password** the institution set for it (V0-023) — a development
    stand-in for the undecided federated mechanism, never presented as decided. A
    locked deployment can still create its **first** administrator through the
    one-shot bootstrap, which has its own switch (`MENTORA_ADMIN_BOOTSTRAP`, default
    on) so that "require a sign-in" does not mean "cannot ever create an account".
    A password is sent in a request **body**, never a query string, so it cannot
    reach an access log.
security:
  - bearerSession: []
  - developmentTenant: []
paths:
  /auth/login:
    post:
      operationId: login
      description: >-
        Present a password for a subject in an institution. On success a short-lived
        session token is returned **once** — only its sha256 digest is stored —
        together with the principal it authorizes. A refusal is a stable code:
        `401 AUTHENTICATION_FAILED` (issue_code `INVALID_CREDENTIALS`), and an unknown
        account and a wrong password are indistinguishable, so this is not an
        enumeration oracle. An availability failure is `503`
        `AUTHENTICATION_UNAVAILABLE` instead, because it is not a denial
        (DEC-RELIABILITY-002).

        The credential *mechanism* is **not a decided technology**: the canonical
        architecture names institutional federation (OIDC/OAuth) and no ADR accepts
        an implementation. The registered adapter is therefore a labelled
        development mock (`local-credentials@1.0.0`, `kind: DEVELOPMENT_MOCK`), and
        the response reports it so a client never presents it as the platform's
        authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: The issued session (the only view of the raw token)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionIssuance'}
        '401':
          description: 'Credentials were not accepted (stable code AUTHENTICATION_FAILED)'
        '503':
          description: 'The capability is unavailable, not denying (stable code AUTHENTICATION_UNAVAILABLE)'
  /auth/logout:
    post:
      operationId: logout
      description: >-
        Revoke the presented session. Idempotent, and deliberately usable with an
        already-expired token: signing out must never fail. `revoked` is false when
        there was nothing to revoke.
      security: []
      responses:
        '200':
          description: Whether a session was revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties: {revoked: {type: boolean}}
  /auth/password:
    post:
      operationId: changePassword
      description: >-
        Change the presented account's own password (V0-023). The current password is
        verified through the same authenticator a sign-in uses, so this is not a
        weaker second path to an account; a wrong one is refused exactly as a refused
        sign-in (`401 AUTHENTICATION_FAILED`, issue_code `INVALID_CREDENTIALS`) and the
        **session stays valid** — a mistyped current password is not a sign-out. On
        success every **other** live session of the account is revoked, so the old
        password cannot keep a stale tab working (DEC-RUNTIME-007); the caller's own
        session is deliberately spared. A password shorter than the (development)
        guard is `400 INVALID_REQUEST` (issue_code `CREDENTIAL_TOO_WEAK`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '200':
          description: The password was changed, and how many other sessions were revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordChange'}
        '400': {description: 'The new password is too short (stable code INVALID_REQUEST, issue_code CREDENTIAL_TOO_WEAK)'}
        '401': {description: 'The current password was not accepted (stable code AUTHENTICATION_FAILED, issue_code INVALID_CREDENTIALS)'}
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      description: >-
        The principal the presented credential authorizes. `authenticated` is false
        for the development tenant shortcut, so a client can label it as development
        instead of showing a signed-in user. The response also reports the credential
        capability, so the mock is visible from the client, and whether this
        deployment accepts the tenant shortcut and exposes the first-administrator
        bootstrap.
      responses:
        '200':
          description: The resolved principal and the capability that resolved it
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrincipalEnvelope'}
        '401':
          description: 'No session and no development header (stable code UNAUTHENTICATED, issue_code SESSION_REQUIRED)'
  /auth/bootstrap-admin:
    post:
      operationId: bootstrapInstitutionAdministrator
      description: >-
        Create the institution's **first** administrator, and nothing else. This is
        the deployment operator's one-shot seam: under institutional federation the
        identity provider provisions the first administrator, which is why it is
        gated on `MENTORA_ADMIN_BOOTSTRAP` (default **on**, so a deployment that
        requires a sign-in can still create its first account) and refuses (`409`,
        issue_code `TENANT_ALREADY_PROVISIONED`) as soon as the tenant has an
        administrator. It is unauthenticated by necessity — there is no administrator
        yet to authorize it — so it writes nothing when it refuses, and a hardened
        deployment turns it off (`404`, issue_code `BOOTSTRAP_DISABLED`). The
        operator picks the password this account signs in with; a password is sent in
        the body, never a query string.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BootstrapRequest'}
      responses:
        '201':
          description: The administrator account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountMutation'}
        '400': {description: 'The password is too short (stable code INVALID_REQUEST, issue_code CREDENTIAL_TOO_WEAK)'}
        '404':
          description: 'The bootstrap is not exposed on this deployment (stable code NOT_FOUND, issue_code BOOTSTRAP_DISABLED)'
        '409':
          description: 'This tenant already has an administrator (stable code CONFLICT, issue_code TENANT_ALREADY_PROVISIONED)'
  /accounts:
    get:
      operationId: listAccounts
      description: >-
        The institution's accounts. Requires `account:read`, and an explicit `role`,
        so listing cannot become an accidental directory dump: a teacher holds
        `account:read` (they choose students for their rosters) but may list
        **students** only, while an administrator may list teachers and students.
      parameters:
        - in: query
          name: role
          required: true
          schema: {type: string, enum: [teacher, student]}
      responses:
        '200':
          description: The tenant's accounts of that role
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountList'}
        '403':
          description: 'Lacks account:read, or asked for a role they may not list (stable code INSUFFICIENT_SCOPE)'
    post:
      operationId: createAccount
      description: >-
        Create a teacher or a student with the password it will sign in with. Requires
        `account:write` — an administrator capability, so a teacher cannot bring an
        account into existence (that is the separation of duties this slice adds; a
        teacher enrols an *existing* student). Create-or-link: the same address and
        role returns the existing account with `created: false` and **sets no
        credential**, so a retry can never overwrite the password the holder may
        already have (DEC-RUNTIME-003); the same address with a different role is
        `409` `EMAIL_ROLE_CONFLICT`, because a create never silently changes a role.
        The body carries the password — never a query string — and `credential_set`
        reports whether it was stored (a federation adapter would report `false`, the
        identity provider owning the credential).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCreateRequest'}
      responses:
        '201':
          description: The created (or already existing) account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountMutation'}
        '400': {description: 'The payload is not valid, or the password is too short (stable code INVALID_REQUEST, issue_code CREDENTIAL_TOO_WEAK)'}
        '403': {description: 'Lacks account:write (stable code INSUFFICIENT_SCOPE)'}
        '409': {description: 'The address exists as another role (stable code CONFLICT, issue_code EMAIL_ROLE_CONFLICT), or the role is not manageable (issue_code ROLE_NOT_MANAGEABLE)'}
        '422': {description: 'The address or role is not valid (stable code INVALID_REQUEST)'}
  /accounts/{accountId}:
    parameters: [{in: path, name: accountId, required: true, schema: {type: string}}]
    get:
      operationId: getAccount
      description: One account of this institution. Requires `account:read`.
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '403': {description: 'Lacks account:read (stable code INSUFFICIENT_SCOPE)'}
        '404': {description: 'No such account in this institution (stable code NOT_FOUND)'}
    patch:
      operationId: updateAccount
      description: >-
        Update an account's display name, role, enabled state or password. Requires
        `account:write`, and takes a **partial body** (an omitted field is unchanged).
        Disabling (`status: DISABLED`) also **revokes the account's live sessions in
        the same transaction**, so it takes effect on the next request rather than at
        session expiry (DEC-RUNTIME-007); re-enabling restores sign-in. Setting
        `password` **resets** it and revokes the account's live sessions too — a reset
        that left other live sessions working would not really have changed who can
        get in — and it is the remedy for a holder who has forgotten theirs. A role
        change is applied the same way a role edit always is: a live session's
        capabilities are re-derived from the account's current role, so a change can
        only ever remove (a promotion needs a fresh sign-in).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountUpdateRequest'}
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountMutation'}
        '400': {description: 'The payload is not valid, or the password is too short (stable code INVALID_REQUEST, issue_code CREDENTIAL_TOO_WEAK)'}
        '403': {description: 'Lacks account:write (stable code INSUFFICIENT_SCOPE)'}
        '404': {description: 'No such account in this institution (stable code NOT_FOUND)'}
        '409': {description: 'The requested role is not manageable (stable code CONFLICT, issue_code ROLE_NOT_MANAGEABLE)'}
    delete:
      operationId: deleteAccount
      description: >-
        Remove an account. Requires `account:write`. Only an account with **no
        enrolment** can be removed — identities are referenced by rosters and audit,
        so an account that has been in a class is deactivated instead (`PATCH
        status: DISABLED`), and this refuses with `409 ACCOUNT_IN_USE`. The account's
        credential material and sessions are removed with it, in one transaction.
      responses:
        '200':
          description: Whether the account was removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountDeletion'}
        '403': {description: 'Lacks account:write (stable code INSUFFICIENT_SCOPE)'}
        '404': {description: 'No such account in this institution (stable code NOT_FOUND)'}
        '409': {description: 'The account is on a class roster (stable code CONFLICT, issue_code ACCOUNT_IN_USE) — deactivate it instead'}
  /courses/{courseId}/materials:
    get:
      operationId: listMaterials
      parameters: [{in: path, name: courseId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Tenant-scoped materials of a course, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Material'}}
    post:
      operationId: uploadMaterial
      parameters: [{in: path, name: courseId, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
      responses: {'202': {description: Accepted}}
  /artifacts/{artifactId}:
    get:
      operationId: getArtifact
      description: >-
        Stored metadata for one uploaded artifact, tenant-scoped. The Teacher
        Studio reads it for the file name it shows as its page title.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        '404':
          description: 'Unknown artifact for this tenant (stable code NOT_FOUND)'
  /artifacts/{artifactId}/compile:
    post:
      operationId: compileArtifact
      description: >-
        Deterministic compile stage (V0-005): structural extraction, a fallback
        render for every slide with explicit fidelity, and the fidelity
        publication gate. Idempotent and re-runnable; renders are
        content-addressed. V0-019 v5: `mode=faithful` (default) reproduces the
        source slide's own layout and styling, drawing any component it cannot
        reproduce (an unavailable source font, a chart/SmartArt, an un-inlinable
        picture) in the platform look in place and recording a warning;
        `mode=themed` keeps the slide's grouping and re-lays its content out in the
        platform theme. Neither claims a native PowerPoint render.
      parameters:
        - {in: path, name: artifactId, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/RenderMode'
      responses:
        '200':
          description: Rendered Content IR plus render and validation reports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompileResult'}
        '400':
          description: 'Unknown render mode (stable code INVALID_REQUEST, issue_code UNKNOWN_RENDER_MODE)'
        '503':
          description: 'Renderer capability unavailable (stable code RENDERER_UNAVAILABLE)'
  /artifacts/{artifactId}/renders/{order}:
    get:
      operationId: getSceneRender
      description: >-
        Deterministic fallback visual for one slide (SVG), re-derived from the
        stored artifact. Tenant-scoped; never serves another tenant's render.
        `mode` selects the render mode (V0-019 v5, default `faithful`).
      parameters:
        - {in: path, name: artifactId, required: true, schema: {type: string}}
        - {in: path, name: order, required: true, schema: {type: integer, minimum: 0}}
        - $ref: '#/components/parameters/RenderMode'
      responses:
        '200':
          description: Rendered slide
          content:
            image/svg+xml:
              schema: {type: string}
        '400':
          description: 'Unknown render mode (stable code INVALID_REQUEST, issue_code UNKNOWN_RENDER_MODE)'
        '503':
          description: 'Scene has no render (stable code RENDERER_UNAVAILABLE)'
  /artifacts/{artifactId}/review-package:
    post:
      operationId: buildReviewPackage
      description: >-
        Teacher review preview (V0-007). Builds the Baseline Content Package for
        the artifact (V0-006, idempotent: source checksum + compiler version +
        renderer identity + renderer config hash determine the package identity)
        and returns the
        read-only review view of it: per-slide render reference, extracted text,
        speaker notes, warnings/fidelity, and the fallback lesson order with its
        safe markers. A package is only built when the V0-005 fidelity gate
        passed, so a document with a FAILED/CANCELLED/missing render answers 409
        and is never offered for review. Nothing here mutates the package.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The review view of the built package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPackage'}
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '409':
          description: 'Fidelity gate failed, so no package was built (stable code PUBLICATION_BLOCKED)'
    get:
      operationId: getReviewPackage
      description: >-
        The review view of the package already stored for this artifact. Cheap:
        it reads the package and never re-renders. 404 when the package has not
        been built yet.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The review view of the stored package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPackage'}
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
  /artifacts/{artifactId}/review-package/renders/{order}:
    get:
      operationId: getReviewRender
      description: >-
        One slide's packaged fallback render (SVG), served from the package
        itself so no re-rendering happens and no unauthenticated asset URL is
        needed. The artifact is only served after the package manifest confirms
        it lists the scene's fallback asset.
      parameters:
        - {in: path, name: artifactId, required: true, schema: {type: string}}
        - {in: path, name: order, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: The packaged slide render
          content:
            image/svg+xml:
              schema: {type: string}
        '404':
          description: 'No built package, or no such scene (stable code NOT_FOUND)'
  /artifacts/{artifactId}/review-package/decision:
    post:
      operationId: recordReviewDecision
      description: >-
        Teacher review action (V0-007): approve or reject the built package.
        Approving a document that is not publishable answers 409
        PUBLICATION_BLOCKED, so a blocking fidelity failure can never be
        approved. A rejection must record a reason. Approving moves the course
        version to APPROVED; the publication transition (APPROVED -> SEALING ->
        INDEXING -> COMMITTING -> PUBLISHED) is V0-008. The decision binds to the
        content version it reviewed (see ReviewState.stale) and is idempotent for
        a repeated identical action. Nothing here mutates the package.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '200':
          description: The review state after the action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewState'}
        '400':
          description: 'A rejection without a reason (stable code INVALID_REQUEST)'
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
        '409':
          description: 'Not publishable; approve refused (stable code PUBLICATION_BLOCKED)'
  /artifacts/{artifactId}/review-package/review-state:
    get:
      operationId: getReviewState
      description: >-
        The review *state* of the artifact's built package: the current decision
        (or null), the newest draft revision, how many revisions exist, the
        course-version status, and whether the decision still covers the current
        content version. Distinct from the ReviewPackage projection, which
        describes the package itself. 404 when no package has been built.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The review state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewState'}
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
  /artifacts/{artifactId}/review-package/drafts:
    post:
      operationId: saveReviewDraft
      description: >-
        Append a draft revision of the lesson order (V0-007). The body's array
        order *is* the proposed order; each entry names a section that must
        already exist in the package's lesson order, so a draft can only reorder
        and re-script. Every structural field (scene_id, scene_step_id,
        safe_markers, type) is inherited from the package, and an omitted script
        keeps the package's script. Refused with 400 when the submitted sections
        are not a rearrangement (issue codes EMPTY_DRAFT, UNKNOWN_SECTION,
        DUPLICATE_SECTION, MISSING_SECTION, INVALID_SCRIPT) and with 409
        REVISION_CONFLICT when a concurrent save won the revision. The immutable
        package is never written: corrections create new versions
        (DEC-CONTENT-005), and the draft is consumed by a later publication step.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDraftRequest'}
      responses:
        '200':
          description: The appended draft revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDraft'}
        '400':
          description: 'The sections are not a rearrangement of the lesson order (stable code INVALID_REQUEST)'
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
        '409':
          description: 'A concurrent save took the revision (issue code REVISION_CONFLICT)'
    get:
      operationId: listReviewDrafts
      description: >-
        Draft revision history for the artifact, newest first. Empty when the
        lesson order was never edited.
      parameters: [{in: path, name: artifactId, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The draft revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDraftList'}
        '403':
          description: 'Artifact belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for this artifact (stable code NOT_FOUND)'
  /course-versions/{versionId}/publish:
    post:
      operationId: publishVersion
      description: >-
        Atomic publication (V0-008). Seals the built package (verifies checksums
        and references, records the manifest and content digests), establishes
        the compatible knowledge-index version, and commits the publication
        metadata, the index-version record and the outbox event in one
        transaction — only after which the version is visible as PUBLISHED.
        Preconditions: the version is APPROVED and its newest review decision is
        an APPROVE covering the package's current content_package_version.
        Idempotent (DEC-RUNTIME-003): the identity is (versionId,
        content_package_version), so a repeat returns the same publication with
        `created: false` instead of a second one. Validation failures are
        refused before anything is written: `issue_code` is NOT_APPROVED,
        STALE_APPROVAL, WRONG_STATE, the validator's code (e.g.
        CHECKSUM_MISMATCH), or INDEX_FAILED.
      parameters: [{in: path, name: versionId, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '200':
          description: The publication (created, or replayed when already published)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedVersion'}
        '403':
          description: 'Version belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'No package has been built for the version''s artifact (stable code NOT_FOUND)'
        '409':
          description: 'Publication refused (stable code PUBLICATION_BLOCKED, precise issue_code)'
  /course-versions/{versionId}/publication:
    get:
      operationId: getVersionPublication
      description: >-
        The newest publication of a course version, or 404 when it has not been
        published. `verify=true` re-reads the pinned package and re-checks it
        against the digest recorded at seal time, adding an `integrity` block
        (VERIFIED / MISMATCH / MISSING).
      parameters:
        - {in: path, name: versionId, required: true, schema: {type: string}}
        - {in: query, name: verify, required: false, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: The publication, optionally with its integrity report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        '403':
          description: 'Version belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'The version has not been published (stable code NOT_FOUND)'
  /publications/{publicationId}:
    get:
      operationId: getPublication
      description: >-
        One publication by identity, including a superseded one: DEC-CONTENT-005
        pins all compatible versions, so a session that started on an older
        publication keeps reading it. A publication of another institution is
        NOT_FOUND rather than forbidden (the lookup is tenant-scoped, so it does
        not leak existence). `verify=true` adds the integrity report.
      parameters:
        - {in: path, name: publicationId, required: true, schema: {type: string}}
        - {in: query, name: verify, required: false, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: The publication, optionally with its integrity report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        '404':
          description: 'Unknown publication or another institution''s (stable code NOT_FOUND)'
  /courses/{courseId}/publications:
    get:
      operationId: listCoursePublications
      description: >-
        A course's publication history, newest first. Superseded publications are
        included: they are history, not deletions.
      parameters:
        - {in: path, name: courseId, required: true, schema: {type: string}}
        - {in: query, name: limit, required: false, schema: {type: integer, default: 50, maximum: 500}}
      responses:
        '200':
          description: The course's publications, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationPage'}
        '403':
          description: 'Course belongs to another institution (stable code TENANT_ACCESS_DENIED)'
  /classes:
    post:
      operationId: scheduleClass
      description: >-
        Schedule a class against a course (V0-009). Scheduling records intent
        only: nothing is pinned until `start`, which resolves the exact runtime
        version tuple once. `version_id` pins a version explicitly (it must belong
        to the course); omitted, `start` resolves the course's current published
        version. `scheduled_for` is recorded, never enforced — there is no
        scheduler or durable workflow (DEC-TECH-003 is OPEN), so `start` is the
        explicit transition.
      parameters:
        - {in: query, name: course_id, required: true, schema: {type: string}}
        - {in: query, name: title, required: false, schema: {type: string, maxLength: 512}}
        - {in: query, name: version_id, required: false, schema: {type: string}}
        - {in: query, name: scheduled_for, required: false, schema: {type: string, format: date-time}}
      responses:
        '201':
          description: The scheduled class
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Class'}
        '400':
          description: 'Malformed request (stable code INVALID_REQUEST): a version that is not this course''s, or a non-ISO scheduled_for'
        '403':
          description: 'Course belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'Unknown course for this tenant (stable code NOT_FOUND)'
    get:
      operationId: listClasses
      description: >-
        The tenant's classes, newest first — except for a **student**, who sees only
        the classes they are enrolled in. The roster is what authorizes a join, so
        it is also the scope of a participant's list: a student may see the classes
        a teacher assigned them, not the institution's whole schedule. A teacher
        (and an institution administrator, who reads for oversight) sees all of
        them.
      parameters:
        - {in: query, name: limit, required: false, schema: {type: integer, default: 100, maximum: 500}}
      responses:
        '200':
          description: Classes of the tenant, scoped to the caller's roster for a student
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Class'}}
  /classes/{classId}:
    get:
      operationId: getClass
      description: >-
        The class with its session and pinned runtime tuple. `session` and
        `session_plan` are null before a successful start. A student is a
        participant, so their read is limited to a class on their roster
        (403 NOT_ENROLLED); staff read by capability.
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: Class, session and pinned runtime tuple
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassView'}
        '403':
          description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED), or a student is not on the class roster (stable code NOT_ENROLLED)'
        '404':
          description: 'Unknown class (stable code NOT_FOUND)'
  /classes/{classId}/start:
    post:
      operationId: startClass
      description: >-
        `SCHEDULED -> PREPARING -> ACTIVE` (V0-009). The session resolves the exact
        runtime tuple **once** — course/version/publication/package/content,
        lesson plan, knowledge-index pin, policy, capability and home region — and
        commits it together with the initial durable snapshot in one transaction,
        so a partial start is invisible and a refused start writes nothing. No
        runtime `latest` lookup exists: after this call a session reads its own
        pinned plan, and a later publication cannot move it (DEC-CONTENT-005).
        Idempotent: a replay returns the same session with `created: false`
        (DEC-RUNTIME-003).
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: >-
            The session, its pinned tuple and its initial snapshot. `created` is
            false when this call replayed an existing session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassStartResult'}
        '403':
          description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'Unknown class (stable code NOT_FOUND)'
        '409':
          description: >-
            The class cannot start (stable code CLASS_NOT_READY). `issue_code` is
            VERSION_NOT_PUBLISHED (draft or never published), INCOMPATIBLE_INDEX
            (the index pin is not about this content), INCOMPATIBLE_CONTENT (the
            package envelope or lesson plan is not one this runtime supports),
            CONTENT_DIGEST_MISMATCH (the pinned bytes no longer match the seal),
            WRONG_STATE, or COMMIT_CONFLICT. The class stays SCHEDULED and nothing
            is written.
  /classes/{classId}/snapshot:
    get:
      operationId: getSnapshot
      description: >-
        The authoritative session snapshot (DEC-DATA-004). Its schema version and
        checksum are validated before it is returned, so a damaged snapshot is
        refused (502 STORAGE_FAILURE, issue_code SNAPSHOT_INVALID) rather than
        replayed. The student's presentation view polls this document to follow
        the teacher's current scene (V0-025); that is a short poll, not the ordered
        per-class event stream (DEC-DATA-003 is OPEN, V1-002).
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: The validated snapshot document and its checksum
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionSnapshot'}
        '403':
          description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED), or a student is not on the class roster (stable code NOT_ENROLLED)'
        '404':
          description: 'Unknown class, or the class has not started (stable code NOT_FOUND)'
        '502':
          description: 'Stored snapshot fails validation (stable code STORAGE_FAILURE, issue_code SNAPSHOT_INVALID)'
  /classes/{classId}/navigate:
    post:
      operationId: navigateClass
      description: >-
        Move the class to a **pinned slide**; requires `class:write`, so only a
        teacher holds it. `order` is the package's scene order, not a lesson
        section: the server resolves it against the session's pinned scene list and
        lesson plan, then sends the in-process aggregate a fully resolved
        `NAVIGATE_SCENE`. It never parses the source deck and never resolves the
        course's current publication, so a correction published mid-lesson cannot
        move a running class (DEC-CONTENT-001, DEC-CONTENT-005). A command is
        idempotent by `command_id` and fenced by `expected_state_version`
        (DEC-RUNTIME-003/DEC-RUNTIME-007). This is an HTTP command over the existing
        aggregate, **not** the ordered per-class live stream (DEC-DATA-003 is OPEN,
        V1-002); the student view learns the new scene by polling the snapshot.
        A refusal writes nothing.
      parameters: [$ref: '#/components/parameters/ClassId']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassNavigateRequest'}
      responses:
        '200':
          description: >-
            The aggregate's verdict, the updated session and the durable snapshot.
            On a duplicate command `snapshot` is null: the first effect already
            happened and nothing new was written.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassCommandResult'}
        '400':
          description: 'The order is negative (stable code INVALID_REQUEST)'
        '403':
          description: 'The principal lacks class:write (stable code INSUFFICIENT_SCOPE), or the class is another institution''s (stable code TENANT_ACCESS_DENIED)'
        '404':
          description: 'Unknown class, or the pinned package has no scene with that order (stable code NOT_FOUND)'
        '409':
          description: >-
            The command cannot be applied: the class has not started (stable code
            CLASS_NOT_READY, issue_code NOT_STARTED), the caller's view is behind
            (stable code CONFLICT, issue_code STALE_STATE_VERSION), the class has
            ended (stable code CONFLICT, issue_code INVALID_TRANSITION), or the
            pinned lesson plan does not name the scene (stable code CONFLICT,
            issue_code INCOMPATIBLE_CONTENT)
  /classes/{classId}/scenes:
    get:
      operationId: listClassScenes
      description: >-
        The slide list of the package the session **pinned** at start, with each
        scene's text and notes. A student page uses it to gather the text of the
        slide the teacher is on, and reads `GET /classes/{classId}/scenes/{order}`
        for the one slide on screen — so opening a lesson does not read every
        asset. Like the single-scene read it resolves the session's own pinned plan,
        never the course's current publication (DEC-CONTENT-005). Requires
        `scene:read`; a student's read is also limited to their own roster
        (403 NOT_ENROLLED).
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: The pinned package's slide list, in slide order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSceneList'}
        '403': {description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED), or a student is not on the class roster (stable code NOT_ENROLLED)'}
        '404': {description: 'Unknown class, or the class has not started (stable code NOT_FOUND)'}
        '502': {description: 'A pinned file no longer matches the digest the package recorded (stable code STORAGE_FAILURE, issue_code SCENE_CHECKSUM_MISMATCH)'}
  /classes/{classId}/scenes/{order}:
    get:
      operationId: getClassScene
      description: >-
        The slide the session is presenting, read from the package the session
        **pinned** at start — never the course's current publication — so publishing
        a correction mid-lesson changes nothing the class sees (DEC-CONTENT-005). The
        response is the packaged fallback render, served through the manifest so a
        caller cannot turn this into an arbitrary object read (DEC-CONTENT-004), and
        each served file is re-checked against the digest the manifest recorded, so a
        file swapped in storage is refused rather than presented. Requires
        `scene:read`.
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
        - in: path
          name: order
          required: true
          description: >-
            The scene's `order` as recorded in the pinned package (the CTF `order`
            field, from 0), not a count of slides.
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: >-
            The slide SVG. `X-Mentora-Package` names the pinned package the bytes came
            from and `X-Mentora-Scene` the scene id, so a client can attribute what it
            is showing.
          headers:
            X-Mentora-Package: {schema: {type: string}, description: 'The pinned package id'}
            X-Mentora-Scene: {schema: {type: string}, description: 'The scene id inside that package'}
          content:
            image/svg+xml:
              schema: {type: string}
        '403': {description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED), or a student is not on the class roster (stable code NOT_ENROLLED)'}
        '404': {description: 'Unknown class, the class has not started, or the pinned package has no such scene (stable code NOT_FOUND)'}
        '502': {description: 'A pinned file no longer matches the digest the package recorded (stable code STORAGE_FAILURE, issue_code SCENE_CHECKSUM_MISMATCH)'}
  /classes/{classId}/enrollments:
    post:
      operationId: enrollStudent
      description: >-
        Add a student to the class roster; requires `enrollment:write`. Two ways to
        name the student, and **neither creates an account**:

        * `email` — resolved against this institution's accounts. An address with no
          account here is `404 ACCOUNT_REQUIRED`: an institution administrator creates
          accounts (`POST /accounts`), a teacher enrols them — teaching assigns people,
          it does not create them (V0-022). The enrolment is idempotent per
          ``(class, student)``, so a retried call is not an error (DEC-RUNTIME-003).
        * `student_id` — enrol an account that already exists, by its id. An id that
          is not an account of this tenant is `404`, not a free-text roster entry.

        The class is validated before the student is resolved, and a refusal writes
        nothing at all.
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
        - {in: query, name: email, required: false, schema: {type: string, format: email, maxLength: 320}}
        - {in: query, name: student_id, required: false, schema: {type: string, maxLength: 256}}
      responses:
        '200':
          description: The enrollment (`created` is false on a replay) and the account it is for.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentResult'}
        '400': {description: 'Neither email nor student_id was given (stable code INVALID_REQUEST)'}
        '403': {description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED), or the principal lacks enrollment:write (stable code INSUFFICIENT_SCOPE)'}
        '404': {description: 'Unknown class; no such account in this tenant; or the address has no account here (stable code NOT_FOUND, issue_code ACCOUNT_REQUIRED)'}
        '409': {description: 'The address exists in this tenant with another role; an enrolment cannot change a role (stable code CONFLICT)'}
    get:
      operationId: listEnrollments
      description: >-
        The class roster the join check is made against; requires `enrollment:write`.
        The roster is other people's identities, so it is a teacher capability: a
        student's own enrolment is reported by the join check and `GET
        /classes/{classId}`, not by this list.
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: The class's enrollments, each with the account it authorizes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentList'}
        '403': {description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED), or the principal lacks enrollment:write (stable code INSUFFICIENT_SCOPE)'}
        '404': {description: 'Unknown class (stable code NOT_FOUND)'}
  /classes/{classId}/enrollments/{studentId}:
    delete:
      operationId: unenrollStudent
      description: >-
        Remove a student from the class roster; requires `enrollment:write`, and is
        idempotent (removing a student who is not enrolled is not an error,
        DEC-RUNTIME-003). The account is untouched — this is a roster correction, not
        an account change. A credential the student already holds stays valid until it
        expires or the actor epoch moves (DEC-RUNTIME-007); what ends immediately is
        the ability to obtain a **new** one, because the join check reads the roster.
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
        - {in: path, name: studentId, required: true, schema: {type: string, maxLength: 256}}
      responses:
        '200':
          description: Whether a roster entry was removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentRemoval'}
        '403': {description: 'Class belongs to another institution (stable code TENANT_ACCESS_DENIED), or the principal lacks enrollment:write (stable code INSUFFICIENT_SCOPE)'}
        '404': {description: 'Unknown class (stable code NOT_FOUND)'}
  /classes/{classId}/bootstrap-token:
    post:
      operationId: issueBootstrapToken
      description: >-
        Issue a short-lived join credential to the **authenticated** student. There is
        no student id in the request: the credential is bound to the session's own
        account, so a caller cannot ask for someone else's join. Joining is a
        **participant** action, so it requires the `join` capability, which the
        student role holds and the teacher role does not: a teacher session — and the
        development tenant shortcut, which is a teacher principal — is refused
        `403 INSUFFICIENT_SCOPE` and never reaches the class. This is where "only
        authorized enrollment can join" is enforced: the class must be ACTIVE and the
        caller's account must be enrolled in it, in the caller's own tenant. The raw
        token is returned once and only its sha256 digest is stored; it binds class,
        student, session and actor epoch (DEC-RUNTIME-007) and carries `subscribe`
        scope only — group student microphones are unpublished by default
        (DEC-TURN-001). The media gateway validates it in V1; this endpoint creates no
        room/SFU (out of scope).
      parameters: [$ref: '#/components/parameters/ClassId']
      responses:
        '200':
          description: The issued credential (the only view of the raw token)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BootstrapToken'}
        '403': {description: 'Not a participant: the principal lacks the `join` capability, e.g. a teacher or the development tenant shortcut (stable code INSUFFICIENT_SCOPE, issue_code SCOPE_REQUIRED); or not enrolled in this class (stable code NOT_ENROLLED); or the class is another institution''s (stable code TENANT_ACCESS_DENIED)'}
        '404': {description: 'Unknown class (stable code NOT_FOUND)'}
        '409': {description: 'The class has not started (stable code CLASS_NOT_READY, issue_code NOT_STARTED)'}
  /renderer:
    get:
      operationId: getRendererStatus
      description: >-
        Renderer capability, identity, health, and the active theme (V0-005,
        V0-019). Reports the default render mode and every available mode; the
        `mode` query parameter inspects a specific one.
      parameters: [$ref: '#/components/parameters/RenderMode']
      responses:
        '200':
          description: Capability report, circuit-breaker state, and mode list
        '400':
          description: 'Unknown render mode (stable code INVALID_REQUEST, issue_code UNKNOWN_RENDER_MODE)'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: >-
        A session token from `POST /auth/login`. The tenant it authorizes is the
        session's own, and it takes precedence over `X-Institution-Id` when both are
        present. Only the token's sha256 digest is stored server-side (V0-021).
    developmentTenant:
      type: apiKey
      in: header
      name: X-Institution-Id
      description: >-
        The development tenant shortcut. It resolves a teacher principal marked
        `authenticated: false` with **no account**, so it can do what a teacher can —
        the authoring and teaching verbs — and nothing that needs a participant
        identity (a class join is the student's `join` capability, and the shortcut
        has no account to bind a credential to either). It is **off by default**
        (V0-023): a deployment requires a real session unless it explicitly sets
        `MENTORA_DEV_TENANT_HEADER=1`. It is not authentication and must not be relied
        on in a deployment.
  parameters:
    RenderMode:
      in: query
      name: mode
      required: false
      description: >-
        Render mode (V0-019 v5). `faithful` (default) reproduces the source
        slide's own layout and styling, drawing what it cannot reproduce in the
        platform look in place; `themed` keeps the slide's grouping and re-lays its
        content out in the platform theme. An unknown value is rejected with
        INVALID_REQUEST (issue_code UNKNOWN_RENDER_MODE).
      schema: {type: string, enum: [themed, faithful]}
    ClassId:
      in: path
      name: classId
      required: true
      description: The class (a scheduled teaching occurrence), tenant-scoped.
      schema: {type: string}
  schemas:
    Artifact:
      description: Stored source presentation metadata (one immutable upload).
      type: object
      required: [artifact_id, course_id, version_id, filename, media_type, sha256, byte_size, object_key, created_at]
      properties:
        artifact_id: {type: string}
        course_id: {type: string}
        version_id: {type: string}
        filename: {type: string}
        media_type: {type: string}
        sha256: {type: string}
        byte_size: {type: integer}
        object_key: {type: string}
        created_at: {type: string}
    Material:
      description: An uploaded source presentation with its version and compiler-job status.
      type: object
      required: [artifact_id, version_id, version, filename, media_type, sha256, byte_size, created_at, job_id, job_status]
      properties:
        artifact_id: {type: string}
        version_id: {type: string}
        version: {type: integer, description: Course version number the artifact belongs to}
        filename: {type: string}
        media_type: {type: string}
        sha256: {type: string}
        byte_size: {type: integer}
        created_at: {type: string}
        job_id: {type: string}
        job_status: {type: string, enum: [PENDING, EXTRACTED, FAILED]}
    RendererIdentity:
      description: Who rendered what, with which config (DEC-CONTENT-006 provenance).
      type: object
      required: [name, version, engine, config_hash, data_region]
      properties:
        name: {type: string}
        version: {type: string}
        engine: {type: string, description: 'Local/dev engine until DEC-TECH-005 is accepted'}
        config_hash: {type: string}
        data_region: {type: string}
    SceneRender:
      description: Render outcome for one slide. Every slide has a render or an explicit FAILED.
      type: object
      required: [order, scene_id, status]
      properties:
        order: {type: integer, minimum: 0}
        scene_id: {type: string}
        status: {type: string, enum: [RENDERED, FAILED, CANCELLED]}
        fidelity:
          type: [string, 'null']
          enum: [NATIVE_RENDERED, COMPATIBLE_RENDERED, STRUCTURAL_RENDERED, THEMED_RENDERED, DEGRADED_RENDERED, null]
        asset_ref: {type: [string, 'null'], description: Content-addressed fallback asset key}
        asset_bytes: {type: integer}
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        fonts_used: {type: array, items: {type: string}}
        missing_fonts: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        error:
          type: [object, 'null']
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
        attempts: {type: integer, minimum: 1}
        duration_ms: {type: integer, minimum: 0}
    RenderUsage:
      type: object
      required: [slides_rendered, slides_failed, slides_cancelled, asset_bytes, duration_ms, cost_units, data_region]
      properties:
        slides_rendered: {type: integer}
        slides_failed: {type: integer}
        slides_cancelled: {type: integer}
        asset_bytes: {type: integer}
        duration_ms: {type: integer}
        cost_units: {type: number}
        data_region: {type: string}
    RenderReport:
      type: object
      required: [cancelled, warnings, usage, scenes]
      properties:
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        cancelled: {type: boolean}
        warnings: {type: array, items: {type: string}}
        usage: {$ref: '#/components/schemas/RenderUsage'}
        scenes: {type: array, items: {$ref: '#/components/schemas/SceneRender'}}
    ValidationIssue:
      type: object
      required: [code, message, severity]
      properties:
        code: {type: string}
        message: {type: string}
        severity: {type: string, enum: [error, review, warning]}
        scene_order: {type: [integer, 'null']}
    ValidationReport:
      description: Fidelity gate. A failed render blocks publication (V0-005 acceptance).
      type: object
      required: [ok, publishable, requires_review, scene_count, issues]
      properties:
        ok: {type: boolean}
        publishable: {type: boolean}
        requires_review: {type: boolean}
        scene_count: {type: integer}
        issues: {type: array, items: {$ref: '#/components/schemas/ValidationIssue'}}
    CompileResult:
      type: object
      required: [content_ir, render, validation, job_status]
      properties:
        content_ir: {type: object, description: 'Internal Content IR (never served to classroom clients)'}
        render: {$ref: '#/components/schemas/RenderReport'}
        validation: {$ref: '#/components/schemas/ValidationReport'}
        job_status: {type: string, enum: [PENDING, EXTRACTED, FAILED]}
    ReviewScene:
      description: >-
        One slide exactly as it appears in the package under review
        (DEC-CONTENT-006: explicit fidelity, renderer identity, warnings).
      type: object
      required: [order, scene_id, fidelity, render_status, render_url, requires_review, missing_fonts, warnings, text, object_count, step_count]
      properties:
        order: {type: integer, minimum: 0}
        scene_id: {type: string}
        fidelity:
          type: [string, 'null']
          enum: [NATIVE_RENDERED, COMPATIBLE_RENDERED, STRUCTURAL_RENDERED, THEMED_RENDERED, DEGRADED_RENDERED, null]
        render_status: {type: string, enum: [RENDERED, FAILED]}
        fallback_asset: {type: [string, 'null'], description: 'Path of the render inside the package'}
        render_url: {type: string, description: 'Endpoint serving this slide, tenant-scoped; versioned with the packaged asset digest (?v=<sha256>) so a recompile cannot be served from cache'}
        requires_review: {type: boolean, description: 'Degraded fidelity (V0-019 v5: a substituted source font or a platform-look fallback component is a warning, not a review)'}
        missing_fonts: {type: array, items: {type: string}, description: 'Source fonts not available to the renderer; each was substituted with the platform stack, in the run''s original frame (V0-019 v5)'}
        warnings: {type: array, items: {type: string}}
        notes: {type: [string, 'null'], description: 'Speaker notes, verbatim (DEC-CONTENT-008)'}
        text: {type: array, items: {type: string}}
        object_count: {type: integer, minimum: 0}
        step_count: {type: integer, minimum: 0}
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        source_ref: {type: object}
    ReviewSection:
      description: One entry of the fallback lesson order (DEC-CONTENT-007).
      type: object
      required: [order, section_id, type, safe_markers]
      properties:
        order: {type: integer, minimum: 0}
        section_id: {type: string}
        type: {type: string, enum: [EXPLANATION, EXAMPLE, MEDIA, QUIZ, DISCUSSION]}
        scene_id: {type: [string, 'null']}
        scene_step_id: {type: [string, 'null']}
        safe_markers: {type: array, items: {type: string}}
        script: {type: [string, 'null']}
        scene_fidelity: {type: [string, 'null']}
        requires_review: {type: boolean}
    ReviewPackage:
      description: >-
        Read-only review projection of a built Baseline Content Package: it
        describes the content itself (render, text, notes, fidelity, lesson
        order) and is a pure function of the stored bytes. The mutable review
        overlay — the decision and the draft revisions — is ReviewState.
        Nothing here is writable, and the publication transition is V0-008.
      type: object
      required: [artifact_id, package_id, prefix, course_id, course_version, content_package_version, knowledge_index_version, created_at, state, publishable, requires_review, scene_count, file_count, placeholder_notice, lesson_order, scenes]
      properties:
        artifact_id: {type: string}
        package_id: {type: string, description: 'Deterministic: identical content resolves to the same package'}
        prefix: {type: string}
        course_id: {type: string}
        course_version: {type: string}
        content_package_version: {type: string}
        lesson_plan_version: {type: [string, 'null']}
        knowledge_index_version: {type: string, description: '"unindexed" until V0-014'}
        teaching_graph_version: {type: [string, 'null']}
        created_at: {type: string}
        state: {type: string, enum: [READY, REVIEW_REQUIRED, BLOCKED]}
        publishable: {type: boolean}
        requires_review: {type: boolean}
        scene_count: {type: integer, minimum: 0}
        file_count: {type: integer, minimum: 0}
        renderer: {oneOf: [{$ref: '#/components/schemas/RendererIdentity'}, {type: 'null'}]}
        placeholder_notice:
          type: string
          description: 'States that the render is a placeholder, not a native render (DEC-TECH-005 is OPEN)'
        lesson_order: {type: array, items: {$ref: '#/components/schemas/ReviewSection'}}
        scenes: {type: array, items: {$ref: '#/components/schemas/ReviewScene'}}
    ReviewDecisionRequest:
      description: An approve/reject action on the built package (V0-007).
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason:
          type: [string, 'null']
          maxLength: 4000
          description: 'Required for REJECT; the audit trail for why the content was refused'
        reviewer:
          type: [string, 'null']
          maxLength: 256
          description: >-
            Attribution only. Identity and roles are not implemented yet, so
            this is not an authorization control; it defaults to the tenant id.
    ReviewDecision:
      description: One recorded review outcome for one content version.
      type: object
      required: [decision_id, artifact_id, version_id, package_id, content_package_version, decision, reviewer, created_at]
      properties:
        decision_id: {type: string}
        artifact_id: {type: string}
        version_id: {type: string}
        package_id: {type: string}
        content_package_version:
          type: string
          description: 'The content the decision covers; a mismatch makes the decision stale'
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason: {type: [string, 'null']}
        reviewer: {type: string}
        created_at: {type: string}
    ReviewDraftSectionRequest:
      description: One entry of a proposed lesson order; array position is the order.
      type: object
      required: [section_id]
      additionalProperties: false
      properties:
        section_id:
          type: string
          minLength: 1
          description: 'Must already exist in the package lesson order'
        script:
          type: [string, 'null']
          maxLength: 20000
          description: 'Omitted/null keeps the package script; empty string means no script'
    ReviewDraftRequest:
      type: object
      required: [sections]
      additionalProperties: false
      properties:
        sections: {type: array, items: {$ref: '#/components/schemas/ReviewDraftSectionRequest'}}
        edited_by:
          type: [string, 'null']
          maxLength: 256
          description: 'Attribution only; defaults to the tenant id'
    ReviewDraftSection:
      description: >-
        One resolved entry of a draft revision. Every structural field is
        inherited from the package under review, so a draft cannot forge or drop
        a scene reference.
      type: object
      required: [order, section_id, type, safe_markers]
      properties:
        order: {type: integer, minimum: 0}
        section_id: {type: string}
        type: {type: string, enum: [EXPLANATION, EXAMPLE, MEDIA, QUIZ, DISCUSSION]}
        scene_id: {type: [string, 'null']}
        scene_step_id: {type: [string, 'null']}
        safe_markers: {type: array, items: {type: string}}
        script: {type: [string, 'null']}
    ReviewDraft:
      description: One immutable revision of a proposed lesson order (append-only).
      type: object
      required: [draft_id, artifact_id, version_id, package_id, content_package_version, revision, sections, edited_by, created_at]
      properties:
        draft_id: {type: string}
        artifact_id: {type: string}
        version_id: {type: string}
        package_id: {type: string}
        content_package_version: {type: string}
        lesson_plan_version: {type: [string, 'null'], description: 'The lesson plan version this draft revises'}
        revision: {type: integer, minimum: 1}
        sections: {type: array, items: {$ref: '#/components/schemas/ReviewDraftSection'}}
        edited_by: {type: string}
        created_at: {type: string}
    ReviewDraftList:
      type: object
      required: [artifact_id, revisions]
      properties:
        artifact_id: {type: string}
        revisions:
          type: array
          description: Newest revision first
          items: {$ref: '#/components/schemas/ReviewDraft'}
    ReviewState:
      description: >-
        The mutable review overlay of one built package: the current decision,
        the newest draft revision, and the blocking picture. `stale` is true when
        the decision covered a different content version than the one now stored,
        so a stale approval is never mistaken for a current one.
      type: object
      required: [artifact_id, version_id, version_status, package_id, content_package_version, state, publishable, requires_review, stale, blocking_scene_orders, draft_count]
      properties:
        artifact_id: {type: string}
        version_id: {type: string}
        version_status:
          type: string
          enum: [DRAFT, PROCESSING, REVIEW_REQUIRED, APPROVED, PUBLISHED, ARCHIVED]
        package_id: {type: string}
        content_package_version: {type: string}
        state: {type: string, enum: [READY, REVIEW_REQUIRED, BLOCKED]}
        publishable: {type: boolean, description: 'False means a blocking failure; approval is refused'}
        requires_review: {type: boolean}
        stale: {type: boolean, description: 'The decision no longer covers the stored content'}
        blocking_scene_orders:
          type: array
          items: {type: integer}
          description: 'Slide orders that failed to render and block approval'
        decision: {oneOf: [{$ref: '#/components/schemas/ReviewDecision'}, {type: 'null'}]}
        draft: {oneOf: [{$ref: '#/components/schemas/ReviewDraft'}, {type: 'null'}]}
        draft_count: {type: integer, minimum: 0}
    PublishRequest:
      description: Optional attribution for a publication (not an authorization control in V0).
      type: object
      additionalProperties: false
      properties:
        published_by: {type: string, maxLength: 256}
    Publication:
      description: >-
        One committed publication: an immutable package plus the compatible
        version tuple a runtime pins (DEC-CONTENT-005, DEC-DATA-005). Rows are
        immutable facts; a correction publishes a new course version and links the
        previous publication through `superseded_by` instead of deleting it.
        `content_digest` is the seal over the published content — re-check it with
        `?verify=true`, which adds `integrity`.
      type: object
      required: [publication_id, institution_id, course_id, version_id, course_version, artifact_id, package_id, content_package_version, lesson_plan_versions, knowledge_index_version, index_version_id, package_prefix, manifest_sha256, content_digest, file_count, total_bytes, state, published_by, created_at]
      properties:
        publication_id: {type: string}
        institution_id: {type: string}
        course_id: {type: string}
        version_id: {type: string}
        course_version: {type: integer, minimum: 1}
        artifact_id: {type: string}
        package_id: {type: string}
        content_package_version: {type: string}
        lesson_plan_versions: {type: array, items: {type: string}}
        knowledge_index_version:
          type: string
          description: 'The pinned index identity (DEC-DATA-005); "unindexed" until V0-014 builds index content'
        teaching_graph_version: {type: [string, 'null']}
        index_version_id: {type: string}
        package_prefix: {type: string, description: 'Object-store prefix the publication pins (packages/<package_id>)'}
        manifest_sha256: {type: string, description: 'Envelope digest as sealed (provenance)'}
        content_digest: {type: string, description: 'Digest over the sealed content; must never change'}
        file_count: {type: integer}
        total_bytes: {type: integer}
        state: {type: string, enum: [PUBLISHED, SUPERSEDED]}
        superseded_by: {type: [string, 'null']}
        published_by: {type: string}
        created_at: {type: string}
        created:
          type: boolean
          description: 'Present on the publish response: false when the request replayed an existing publication'
        integrity: {$ref: '#/components/schemas/PublicationIntegrity'}
    PublishedVersion:
      description: 'The publish response: the publication plus whether this call created it.'
      allOf:
        - {$ref: '#/components/schemas/Publication'}
        - type: object
          required: [created]
          properties:
            created: {type: boolean}
    PublicationPage:
      type: object
      required: [course_id, publications]
      properties:
        course_id: {type: string}
        publications:
          type: array
          description: Newest first; superseded publications included
          items: {$ref: '#/components/schemas/Publication'}
    PublicationIntegrity:
      description: >-
        Result of re-checking a published package against the digest recorded at
        seal time (opt-in with `?verify=true`). VERIFIED means the pinned content
        is exactly what was published; MISMATCH means something overwrote or
        dropped part of it, and `issues` names which validator codes fired —
        `PUBLICATION_BLOCKED` is not returned, because a caller asking for a
        verdict wants the verdict.
      type: object
      required: [state, package_id, expected_digest, observed_digest, file_count, issues]
      properties:
        state: {type: string, enum: [VERIFIED, MISMATCH, MISSING]}
        package_id: {type: string}
        expected_digest: {type: string}
        observed_digest: {type: string}
        file_count: {type: integer}
        issues: {type: array, items: {type: string}}
    Class:
      description: >-
        A scheduled teaching occurrence (V0-009). It pins nothing until it starts;
        `version_id` is the version the teacher named when scheduling, and null
        means the start resolves the course's current published version once.
      type: object
      required: [class_id, institution_id, course_id, title, state, created_at]
      properties:
        class_id: {type: string}
        institution_id: {type: string}
        course_id: {type: string}
        title: {type: string}
        version_id:
          type: [string, 'null']
          description: 'An explicit version pin, or null to resolve at start'
        scheduled_for:
          type: [string, 'null']
          description: 'Recorded intent only; there is no scheduler (DEC-TECH-003 is OPEN)'
        state:
          type: string
          enum: [SCHEDULED, ACTIVE, DEGRADED, RECOVERING, ENDING, COMPLETED, FAILED]
          description: >-
            SCHEDULED until a successful start; the transitions after ACTIVE
            belong to the Classroom Actor (V0-010). PREPARING is in-flight only and
            is never stored.
        created_at: {type: string}
        started_at: {type: [string, 'null']}
    ClassView:
      description: A class with its session and pinned runtime tuple (both null before a start).
      type: object
      required: [class, session, session_plan]
      properties:
        class: {$ref: '#/components/schemas/Class'}
        session: {oneOf: [{$ref: '#/components/schemas/ClassroomSession'}, {type: 'null'}]}
        session_plan: {oneOf: [{$ref: '#/components/schemas/RuntimeSessionPlan'}, {type: 'null'}]}
    RuntimeVersions:
      description: >-
        The pinned runtime tuple (docs/architecture/03_DOMAIN_OWNERSHIP_AND_VERSIONING.md):
        every member is a resolved value, never a lookup. `latest` is forbidden, so
        a later publication cannot move a running session. `assessment_version` and
        `model_routing_version` are explicit nulls because V0 has neither subsystem.
      type: object
      required: [course_id, course_version, version_id, publication_id, package_id, content_package_version, content_digest, lesson_plan_version, knowledge_index_version, index_version_id, index_source_digest, policy_version, capability_version, region]
      properties:
        course_id: {type: string}
        course_version: {type: integer, minimum: 1}
        version_id: {type: string}
        publication_id: {type: string}
        package_id: {type: string}
        content_package_version: {type: string}
        content_digest: {type: string, description: 'The seal digest of the pinned bytes'}
        lesson_plan_version: {type: string}
        knowledge_index_version: {type: string}
        index_version_id: {type: string}
        index_source_digest:
          type: string
          description: 'The content this index pin is compatible with (DEC-DATA-005)'
        teaching_graph_version: {type: [string, 'null']}
        assessment_version: {type: [string, 'null']}
        model_routing_version: {type: [string, 'null']}
        policy_version:
          type: string
          description: 'Names the LOCKED default policy set the session ran under'
        capability_version:
          type: string
          description: 'The warmed capability identity, name@version of the default renderer'
        region: {type: string, description: 'Home region (DEC-DEPLOY-002); configuration, not a decided geography'}
    RuntimeSessionPlan:
      description: >-
        The class-specific immutable tuple (terminology: RuntimeSessionPlan, owner
        Class Management), written once at start with no update path.
      type: object
      required: [session_plan_id, class_id, versions, capabilities, created_at]
      properties:
        session_plan_id: {type: string}
        class_id: {type: string}
        versions: {$ref: '#/components/schemas/RuntimeVersions'}
        capabilities:
          type: object
          description: 'Renderer identity and support the session admitted through'
          properties:
            identity: {type: object}
            support: {type: object}
        created_at: {type: string}
    ClassroomSession:
      description: The durable session created at start, with its initial authoritative state.
      type: object
      required: [session_id, class_id, course_id, session_plan_id, state, actor_epoch, state_version, event_sequence, created_at, started_at]
      properties:
        session_id: {type: string}
        class_id: {type: string}
        course_id: {type: string}
        session_plan_id: {type: string}
        state: {type: string, enum: [SCHEDULED, ACTIVE, DEGRADED, RECOVERING, ENDING, COMPLETED, FAILED]}
        actor_epoch:
          type: integer
          minimum: 1
          description: 'Initial epoch is 1; ownership transfer/fencing is V1-002 (DEC-RUNTIME-007)'
        state_version: {type: integer, minimum: 1}
        event_sequence: {type: integer, minimum: 0}
        snapshot_id: {type: [string, 'null']}
        created_at: {type: string}
        started_at: {type: string}
    SessionSnapshot:
      description: >-
        A durable, checksummed snapshot (DEC-DATA-004). Validated before use: an
        unsupported schema version, a missing region, or a checksum mismatch is
        refused rather than replayed. `document` carries versions, lesson/scene/step,
        turn (queue/floor), timeline checkpoint, pending effects, epoch/version/sequence.
      type: object
      required: [snapshot_id, class_id, session_id, schema_version, state, state_version, event_sequence, actor_epoch, checksum, created_at, document]
      properties:
        snapshot_id: {type: string}
        class_id: {type: string}
        session_id: {type: string}
        schema_version: {type: string, description: 'e.g. runtime-snapshot@1'}
        state: {type: string}
        state_version: {type: integer}
        event_sequence: {type: integer}
        actor_epoch: {type: integer}
        checksum: {type: string, description: 'sha256 over the canonical document'}
        created_at: {type: string}
        document: {type: object}
    ClassStartResult:
      description: 'The start response: the class, its session, the pinned tuple and the initial snapshot.'
      type: object
      required: [class, session, session_plan, snapshot, created]
      properties:
        class: {$ref: '#/components/schemas/Class'}
        session: {$ref: '#/components/schemas/ClassroomSession'}
        session_plan: {$ref: '#/components/schemas/RuntimeSessionPlan'}
        snapshot: {$ref: '#/components/schemas/SessionSnapshot'}
        created:
          type: boolean
          description: 'False when the request replayed an existing session (DEC-RUNTIME-003)'
    ClassNavigateRequest:
      description: >-
        The teacher's presentation control: which pinned slide to show. `order` is
        the scene order the package recorded (0-based), not a lesson section. The
        server resolves it against the session's pinned scene list and lesson plan,
        so the client never supplies a scene id or section position.
      type: object
      required: [order]
      properties:
        order:
          type: integer
          minimum: 0
          description: 'The pinned scene order from `GET /classes/{classId}/scenes`'
        expected_state_version:
          type: [integer, 'null']
          minimum: 1
          description: >-
            Optional fence: the state version the caller is showing. A stale value
            is refused (409 CONFLICT, issue_code STALE_STATE_VERSION).
        command_id:
          type: [string, 'null']
          description: >-
            Optional idempotency key (DEC-RUNTIME-003). A replay returns the stored
            verdict with `duplicate: true` and no new snapshot.
    ClassCommandEvent:
      description: 'One ordered effect of an accepted command (DEC-DATA-003''s unit).'
      type: object
      required: [event_id, type, sequence, state_version, actor_epoch, occurred_at, payload]
      properties:
        event_id: {type: string}
        type: {type: string}
        sequence: {type: integer, minimum: 0}
        state_version: {type: integer, minimum: 1}
        actor_epoch: {type: integer, minimum: 1}
        occurred_at: {type: string}
        payload: {type: object}
    ClassCommandVerdict:
      description: >-
        The terminal verdict of a command. A duplicate returns the original verdict
        with `duplicate: true`; a refusal is returned as a 409 by the API.
      type: object
      required: [command_id, accepted, issue_code, state_version, event_sequence, duplicate, events]
      properties:
        command_id: {type: string}
        accepted: {type: boolean}
        issue_code: {type: [string, 'null']}
        state_version: {type: integer, minimum: 1}
        event_sequence: {type: integer, minimum: 0}
        duplicate: {type: boolean}
        events: {type: array, items: {$ref: '#/components/schemas/ClassCommandEvent'}}
    ClassCommandResult:
      description: >-
        The result of an accepted class command: the verdict, the updated session
        and the durable snapshot the transition appended. `snapshot` is null on a
        duplicate command (nothing new was written).
      type: object
      required: [result, session, snapshot]
      properties:
        result: {$ref: '#/components/schemas/ClassCommandVerdict'}
        session: {oneOf: [{$ref: '#/components/schemas/ClassroomSession'}, {type: 'null'}]}
        snapshot: {oneOf: [{$ref: '#/components/schemas/SessionSnapshot'}, {type: 'null'}]}
    ClassSceneList:
      description: >-
        The slides of the package a session pinned, with each scene's text and notes.
        One entry per scene document; the render for one of them is `GET
        /classes/{classId}/scenes/{order}`.
      type: object
      required: [class_id, package_id, content_digest, scene_count, scenes]
      properties:
        class_id: {type: string}
        package_id: {type: string}
        content_digest: {type: string, description: 'The seal of the package these bytes came from'}
        scene_count: {type: integer}
        scenes: {type: array, items: {$ref: '#/components/schemas/ClassScene'}}
    ClassScene:
      type: object
      required: [order, scene_id, fidelity, notes, text, warnings, object_count, step_count]
      properties:
        order: {type: integer, description: 'The CTF scene order (from 0), which is also the id to render'}
        scene_id: {type: string}
        fidelity: {oneOf: [{type: string}, {type: 'null'}]}
        notes: {oneOf: [{type: string}, {type: 'null'}], description: 'Speaker notes, when the author wrote any'}
        text:
          type: array
          items: {type: string}
          description: >-
            The slide's own text, in paint order, blank paragraphs dropped — the same
            rule the teacher review projection uses, so the two never disagree.
        warnings: {type: array, items: {type: string}}
        object_count: {type: integer}
        step_count: {type: integer}
    Enrollment:
      description: One student's authorization to join one class.
      type: object
      required: [enrollment_id, class_id, student_id, created_at]
      properties:
        enrollment_id: {type: string}
        class_id: {type: string}
        student_id: {type: string, description: 'The account id this enrolment authorizes'}
        created_at: {type: string}
        created:
          type: boolean
          description: 'Present on the enroll response: false when the enrollment already existed'
    EnrollmentList:
      type: object
      required: [class_id, enrollments]
      properties:
        class_id: {type: string}
        enrollments: {type: array, items: {$ref: '#/components/schemas/EnrollmentWithAccount'}}
    EnrollmentWithAccount:
      description: >-
        An enrollment plus the account behind it, for the teacher roster. `student` is
        null when the recorded student id is not an account of this tenant (possible
        only for rows written before identities existed).
      allOf:
        - {$ref: '#/components/schemas/Enrollment'}
        - type: object
          properties:
            student: {oneOf: [{$ref: '#/components/schemas/Account'}, {type: 'null'}]}
    EnrollmentResult:
      description: >-
        The outcome of an enrolment. Enrolment **never creates an account**, so there
        is no credential here: an administrator creates accounts (`POST /accounts`),
        a teacher enrols them (V0-022).
      allOf:
        - {$ref: '#/components/schemas/Enrollment'}
        - type: object
          required: [student]
          properties:
            student: {$ref: '#/components/schemas/Account'}
    Account:
      description: A platform account, scoped to one institution (V0-021, V0-022).
      type: object
      required: [account_id, institution_id, email, display_name, role, scopes, status, created_at]
      properties:
        account_id: {type: string}
        institution_id: {type: string}
        email: {type: string}
        display_name: {type: string}
        role:
          type: string
          enum: [institution_admin, teacher, student]
          description: >-
            Canonical role names from `docs/ARC_OVERVIEW.md` §27 (*Identity, SSO, and
            Roles*). V0 has a product surface for three of that list's roles and models
            exactly those: `institution_admin` (Institution Administrator),
            `teacher` and `student`. The others (platform administrator, IT operator,
            course administrator, teaching assistant, moderator, auditor) are **not**
            modelled; naming them here would be inventing policy the specification has
            not fixed.
        scopes: {type: array, items: {type: string}, description: 'The capabilities this account currently holds'}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        created_at: {type: string}
    AccountList:
      description: The institution's accounts of one role.
      type: object
      required: [institution_id, role, accounts]
      properties:
        institution_id: {type: string}
        role: {type: string, enum: [teacher, student]}
        accounts: {type: array, items: {$ref: '#/components/schemas/Account'}}
    AccountMutation:
      description: >-
        The result of creating or updating an account. `credential_set` reports
        whether this call stored a password the account can sign in with: `true` when
        an administrator supplied one through a credential-managing adapter, `false`
        on a create-or-link replay (which never touches the credential) or when the
        wired adapter does not manage local credentials at all (federation, where the
        identity provider owns the credential). No value of a credential is ever
        returned.
      type: object
      required: [created, account, credential_set]
      properties:
        created: {type: boolean, description: 'False when the account already existed (replay)'}
        account: {$ref: '#/components/schemas/Account'}
        credential_set: {type: boolean, description: 'Whether this call stored a password for the account'}
        sessions_revoked: {type: integer, description: 'Live sessions revoked by this change (a disable or a password reset)'}
    AccountDeletion:
      description: Whether an unreferenced account was removed.
      type: object
      required: [account_id, deleted]
      properties:
        account_id: {type: string}
        deleted: {type: boolean}
    AccountCreateRequest:
      description: >-
        A new teacher or student, with the password it will sign in with. A body, not
        query parameters, so the password never reaches an access log or browser
        history.
      type: object
      required: [email, role, password]
      additionalProperties: false
      properties:
        email: {type: string, minLength: 1, maxLength: 320}
        role: {type: string, enum: [teacher, student]}
        password: {type: string, minLength: 1, maxLength: 1024, description: 'The initial password; the (development) guard requires at least 8 characters'}
        display_name: {type: [string, 'null'], maxLength: 256}
    AccountUpdateRequest:
      description: >-
        A partial change to an account. An omitted field is unchanged; `password`
        resets it and revokes the account's live sessions.
      type: object
      additionalProperties: false
      properties:
        display_name: {type: [string, 'null'], maxLength: 256}
        role: {type: string, enum: [teacher, student]}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        password: {type: [string, 'null'], maxLength: 1024, description: 'A new password (a reset); the (development) guard requires at least 8 characters'}
    EnrollmentRemoval:
      description: Whether a roster entry was removed.
      type: object
      required: [class_id, student_id, removed]
      properties:
        class_id: {type: string}
        student_id: {type: string}
        removed: {type: boolean, description: 'False when the student was not enrolled (idempotent)'}
    Principal:
      description: >-
        The identity a request is authorized as. `authenticated` distinguishes a real
        sign-in from the development tenant shortcut; `account_id` is null for the
        latter. `scopes` is the session's capability set intersected with the
        account's current role, so it is what this request may actually do: a teacher
        holds no `join`, because joining a class is the student's participant action.
      type: object
      required: [authenticated, institution_id, role, scopes, account_id, email, display_name, session_id]
      properties:
        authenticated: {type: boolean}
        institution_id: {type: string}
        role: {type: string, enum: [institution_admin, teacher, student]}
        scopes: {type: array, items: {type: string}}
        account_id: {oneOf: [{type: string}, {type: 'null'}]}
        email: {oneOf: [{type: string}, {type: 'null'}]}
        display_name: {oneOf: [{type: string}, {type: 'null'}]}
        session_id: {oneOf: [{type: string}, {type: 'null'}]}
    LoginRequest:
      description: A subject proving it is an account in an institution.
      type: object
      required: [institution_id, email, password]
      additionalProperties: false
      properties:
        institution_id: {type: string, minLength: 1, maxLength: 256}
        email: {type: string, minLength: 1, maxLength: 320}
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            The password the account signs in with. Opaque to the API: with the
            development mock it is a password an administrator set; an
            authorization-code result or an assertion takes its place once federation
            is decided.
    PasswordChangeRequest:
      description: A signed-in account changing its own password (V0-023).
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024}
        new_password: {type: string, minLength: 1, maxLength: 1024, description: 'The (development) guard requires at least 8 characters'}
    PasswordChange:
      description: The outcome of a password change.
      type: object
      required: [changed, sessions_revoked]
      properties:
        changed: {type: boolean, description: 'Always true on a 200'}
        sessions_revoked: {type: integer, description: 'Other live sessions revoked by the change; the caller''s own is kept'}
    BootstrapRequest:
      description: >-
        The deployment's first administrator and the password it signs in with. A
        body, like every request that carries a password.
      type: object
      required: [institution_id, email, password]
      additionalProperties: false
      properties:
        institution_id: {type: string, minLength: 1, maxLength: 256}
        email: {type: string, minLength: 1, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 1024, description: 'The (development) guard requires at least 8 characters'}
        display_name: {type: [string, 'null'], maxLength: 256}
    SessionIssuance:
      description: >-
        The result of a sign-in. The token is returned **once**; only its digest is
        stored. `authenticator` names the capability that answered, so a client can see
        when it is a development mock.
      type: object
      required: [authenticated, token, token_type, expires_at, principal, authenticator]
      properties:
        authenticated: {type: boolean}
        token: {type: string, description: 'The raw session token; the only time it is returned'}
        token_type: {type: string, enum: [Bearer]}
        expires_at: {type: string, description: 'Bounded lifetime; revocation is the other terminal path'}
        principal: {$ref: '#/components/schemas/Principal'}
        authenticator: {$ref: '#/components/schemas/CapabilityIdentity'}
        notice: {type: string, description: 'A sentence a client may show verbatim about which mechanism answered'}
    PrincipalEnvelope:
      description: The current principal plus the capability that resolved it.
      type: object
      required: [principal, authenticator, development_shortcut, admin_bootstrap]
      properties:
        principal: {$ref: '#/components/schemas/Principal'}
        authenticator: {$ref: '#/components/schemas/CapabilityIdentity'}
        notice: {type: string}
        development_shortcut:
          type: boolean
          description: 'True when the development tenant header is accepted by this deployment (off unless explicitly enabled, V0-023)'
        admin_bootstrap:
          type: boolean
          description: 'True when this deployment exposes the one-shot first-administrator bootstrap (V0-023)'
    CapabilityIdentity:
      description: >-
        Who provided a replaceable capability, and whether it is a real implementation
        or a stand-in for an OPEN decision (the same shape the renderer and voice
        capabilities report).
      type: object
      required: [id, name, version, kind]
      properties:
        id: {type: string, description: 'name@version, e.g. local-credentials@1.0.0'}
        name: {type: string}
        version: {type: string}
        kind: {type: string, enum: [DEVELOPMENT_MOCK, IMPLEMENTATION]}
    BootstrapToken:
      description: >-
        A short-lived join credential. Returned once — only its sha256 digest is
        stored — bound to the class, student, session and actor epoch, with
        subscribe scope only.
      type: object
      required: [token, class_id, session_id, student_id, actor_epoch, nonce, scopes, issued_at, expires_at]
      properties:
        token: {type: string, description: 'The raw credential; the only time it is returned'}
        class_id: {type: string}
        session_id: {type: string}
        student_id: {type: string}
        actor_epoch: {type: integer, description: 'A token from a stale epoch cannot authorize'}
        nonce: {type: string}
        scopes: {type: array, items: {type: string, enum: [subscribe]}, description: 'Subscribe only: floor/publish_audio is the floor token (DEC-TURN-008)'}
        issued_at: {type: string}
        expires_at: {type: string, description: 'Bounded lifetime; the terminal path besides revocation'}

