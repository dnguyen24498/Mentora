    status: LOCKED
    decision: "Runtime recovers through durable snapshot plus ordered event replay."
  - id: DEC-DATA-005
    status: LOCKED
    decision: "Knowledge retrieval is tenant/course/version filtered and index-version pinned."
  - id: DEC-RELIABILITY-001
    status: LOCKED
    decision: "Every external capability has deadline, bounded retry, circuit breaker, admission control, and fallback."
  - id: DEC-RELIABILITY-002
    status: LOCKED
    decision: "The system targets bounded failure and state integrity, not impossible zero failure."
  - id: DEC-DEPLOY-001
    status: LOCKED
    decision: "V1 control plane is a modular monolith; compiler, media, search, and GPU voice scale independently."
  - id: DEC-DEPLOY-002
    status: LOCKED
    decision: "Each class has a home region for latency-sensitive services."
  - id: DEC-PERSONAL-001
    status: LOCKED
    decision: "Group adaptation and individual adaptation are separate."
  - id: DEC-SCORM-001
    status: LOCKED
    decision: "SCORM is either structurally imported or executed in a restricted sandbox, not assumed universally convertible."
