    status: LOCKED
    decision: "Typed questions remain an accessibility and failure fallback."
  - id: DEC-DATA-001
    status: LOCKED
    decision: "PostgreSQL or equivalent durable relational store owns durable institutional/session truth."
  - id: DEC-DATA-002
    status: LOCKED
    decision: "Redis is limited to cache, projection, routing, revocation, and realtime coordination."
  - id: DEC-DATA-003
    status: LOCKED
    decision: "There is an ordered command/event mechanism per class_id."
